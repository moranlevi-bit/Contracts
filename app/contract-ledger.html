te is March 15, 2027","page":12,"conf":"high","st":"conflict","prev":"2027-01-31"},"lateFees":{"v":"1.0% per month","src":"late charge of 1.0% per month","page":2,"conf":"high","st":"verified"},"terminationRights":{"v":"No exit for convenience in first 12 months; then 90 days' notice","src":"Client may not terminate for convenience during the first 12 months","page":2,"conf":"high","st":"verified"},"terminationFees":{"v":"None after the first year","src":"with no termination fee","page":2,"conf":"high","st":"verified"},"curePeriod":{"v":"30 days","src":"fails to cure within 30 days.","page":2,"conf":"high","st":"verified"},"liabilityCap":{"v":"Fees paid in the prior 12 months","src":"limited to the fees paid by Client in the 12 months","page":3,"conf":"high","st":"verified"},"governingLaw":{"v":"Delaware","src":"governed by the laws of the State of Delaware","page":7,"conf":"high","st":"verified"},"annualValue":{"v":28650,"src":"Client will pay $425 per provider per month","page":1,"conf":"medium","st":"unverified"},"totalValue":{"v":54297,"src":"the per-provider fee increases by 3%","page":1,"conf":"medium","st":"unverified"}},"obligations":[{"id":"ex0","side":"theirs","text":"Pay Q4 2026 subscription invoice (4 providers)","category":"Payment","due":"2026-10-31","recurrence":"One-time","amount":5100,"src":"Invoices are payable within 30 days of the invoice date","page":2,"status":"open","conditional":false,"condition":"","graceDays":null,"lateTerms":"1.0% per month late charge","owner":"","note":""},{"id":"ex1","side":"theirs","text":"Pay quarterly invoice for 5 providers","category":"Payment","due":"2027-01-31","recurrence":"Quarterly","amount":6225,"src":"From January 2027, the Additional Provider Fee is included in each quarterly invoice","page":12,"status":"open","conditional":false,"condition":"","graceDays":null,"lateTerms":"1.0% per month late charge","owner":"","note":"","until":"2028-05-31"},{"id":"ex2","side":"theirs","text":"Pay December 2026 fee for the 5th provider (billed Jan 1, 2027)","category":"Payment","due":"2027-01-31","recurrence":"One-time","amount":375,"src":"The Additional Provider Fee for December 2026 will be invoiced with the January 1, 2027 quarterly invoice","page":12,"status":"open","conditional":false,"condition":"","graceDays":null,"lateTerms":"","owner":"","note":""},{"id":"ex3","side":"theirs","text":"Pay Adoption Incentive Fee if portal activation reaches 60% ($8,000) or 75% ($12,000)","category":"Payment","due":"2027-03-30","recurrence":"One-time","amount":12000,"src":"Active Portal Rate of 75% or more: $12,000","page":1,"status":"open","conditional":true,"condition":"Active Portal Rate measured on Mar 15, 2027 (amended): 60% to under 75% = $8,000; 75%+ = $12,000","graceDays":null,"lateTerms":"","owner":"","note":""},{"id":"ex4","side":"theirs","text":"Encourage patients to activate portal accounts","category":"Compliance","due":null,"recurrence":"Ongoing","amount":null,"src":"Client will make reasonable efforts to encourage patients to activate portal accounts","page":4,"status":"open","conditional":false,"condition":"","graceDays":null,"lateTerms":"","owner":"","note":""},{"id":"ex5","side":"theirs","text":"Report changes in provider count within 15 days","category":"Notice","due":null,"recurrence":"Ongoing","amount":null,"src":"Client will notify Provider within 15 days after any change in the number of providers","page":4,"status":"open","conditional":false,"condition":"","graceDays":null,"lateTerms":"","owner":"","note":""},{"id":"ex6","side":"mine","text":"Deliver the portal adoption measurement report and invoice the bonus","category":"Reporting","due":"2027-03-30","recurrence":"One-time","amount":null,"src":"Provider will deliver the measurement report and invoice any Adoption Incentive Fee within 15 days after the new Measurement Date","page":12,"status":"open","conditional":false,"condition":"","graceDays":null,"lateTerms":"","owner":"","note":""},{"id":"ex7","side":"mine","text":"Supply registration prompts, scripts and message templates","category":"Delivery","due":null,"recurrence":"Ongoing","amount":null,"src":"using the registration prompts, check-in scripts and message templates Provider supplies","page":4,"status":"open","conditional":false,"condition":"","graceDays":null,"lateTerms":"","owner":"","note":""},{"id":"ex8","side":"mine","text":"Notify the practice of any security incident within 72 hours","category":"Data & security","due":null,"recurrence":"Ongoing","amount":null,"src":"within 72 hours after confirming a Security Incident","page":4,"status":"open","conditional":false,"condition":"","graceDays":null,"lateTerms":"","owner":"","note":""}],"sourceText":"[[Page 1]]\nSubscription Agreement with Adoption\nIncentive\nCareConnect Patient Management Platform: Maple Street Family Medicine\nSample contract for testing purposes only. All parties are fictional. Not legal advice.\nThis Agreement is entered into as of June 1, 2026 (the \"Effective Date\") between\nMediLink Systems, Inc., a Delaware corporation (\"Provider\"), and Maple Street Family\nMedicine, LLC, a primary care practice (\"Client\").\n1. Services\nProvider grants Client access to the CareConnect platform, including patient registration,\nscheduling, the patient portal, reminders and reporting (the \"Services\"). The target date\nfor Go-Live is August 1, 2026.\n2. Term and Renewal\n2.1 Initial Term. The Initial Term is 24 months, from June 1, 2026 through May 31, 2028.\n2.2 Renewal. After the Initial Term, this Agreement renews automatically for successive\n12-month terms unless either party gives written notice of non-renewal at least 90 days\nbefore the end of the then-current term.\n3. Fees\n3.1 Implementation Fee. Client will pay a one-time Implementation Fee of $6,000: 50%\n($3,000) upon signing and 50% ($3,000) upon Go-Live.\n3.2 Subscription Fee. Client will pay $425 per provider per month. Client has 4 providers\nat signing, so the initial monthly Subscription Fee is $1,700.\n3.3 Annual Increase. On each anniversary of the Effective Date, beginning June 1, 2027,\nthe per-provider fee increases by 3%.\n3.4 Adoption Incentive Fee. Client will pay Provider a one-time Adoption Incentive Fee\nbased on the Active Portal Rate measured on the Measurement Date:\nActive Portal Rate of 60% or more but less than 75%: $8,000\nActive Portal Rate of 75% or more: $12,000\nActive Portal Rate below 60%: no Adoption Incentive Fee\n\n[[Page 2]]\n\"Active Portal Rate\" means the percentage of unique patients seen during the six months\nbefore the Measurement Date who have activated a patient portal account. The\n\"Measurement Date\" is the last day of the sixth full month after Go-Live, which, based on\nthe target Go-Live date, is January 31, 2027. Provider will deliver a measurement report\nwithin 10 days after the Measurement Date and invoice any Adoption Incentive Fee within\n15 days after the Measurement Date.\n4. Billing and Payment\n4.1 The first invoice, dated the Effective Date, covers June 2026. After that, Subscription\nFees are invoiced quarterly in advance on the first day of each calendar quarter, beginning\nJuly 1, 2026.\n4.2 Invoices are payable within 30 days of the invoice date. Overdue amounts accrue a\nlate charge of 1.0% per month.\n5. Service Levels\nProvider will use commercially reasonable efforts to make the Services available 99.0% of\neach month. Repeated failure to meet this target entitles Client to raise the matter under\nSection 6.1.\n6. Termination\n6.1 For Cause. Either party may terminate on written notice if the other party materially\nbreaches this Agreement and fails to cure within 30 days.\n6.2 For Convenience. Client may not terminate for convenience during the first 12 months.\nAfter the first anniversary of the Effective Date, Client may terminate for convenience on\n90 days' written notice with no termination fee. Any accrued Adoption Incentive Fee\nremains payable.\n6.3 On termination, Provider will return Client's data in a standard format within 30 days.\n7. Data Protection\nThe parties will sign Provider's standard Business Associate Agreement, which governs\nprotected health information.\n\n[[Page 3]]\n8. Confidentiality\nEach party will protect the other's confidential information with at least reasonable care\nand use it only to perform this Agreement.\n9. Limitation of Liability\nEach party's total liability under this Agreement is limited to the fees paid by Client in the\n12 months before the claim arose. Neither party is liable for indirect or consequential\ndamages.\n10. Intellectual Property and Data Rights\n10.1 Provider Property. Provider and its licensors own all right, title and interest in the\nServices, the CareConnect software, the Documentation and all improvements to them.\nClient receives only the limited right to use the Services during the term.\n10.2 Client Data. Client owns all Client Data, including protected health information\n(\"PHI\"). Client grants Provider a limited, non-exclusive license to host, process and\ntransmit Client Data solely to provide the Services and support, and as permitted by the\nBusiness Associate Agreement.\n10.3 De-identified Data. Provider may create de-identified data only as permitted by the\nBusiness Associate Agreement and 45 C.F.R. \u00a7 164.514, and may use it only to operate,\nsecure and improve the Services. Provider will not re-identify it or sell it.\n10.4 Restrictions. Client will not copy or modify the Services, reverse engineer them\nexcept where law permits, resell or sublicense them, circumvent security or usage limits,\nor use them to send unlawful or unsolicited messages.\n10.5 Feedback. Provider may use Client's suggestions about the Services without\nobligation, provided it does not disclose Client's confidential information or PHI.\n11. Client Responsibilities\n11.1 Client will name an administrator who can approve configuration decisions and\nmanage user accounts.\n11.2 Client is responsible for the accuracy and lawfulness of Client Data and for its users'\ncompliance with this Agreement. Client will keep credentials confidential and deactivate\naccounts of departed staff promptly.\n\n[[Page 4]]\n11.3 Patient Portal Adoption. Client will make reasonable efforts to encourage patients to\nactivate portal accounts, including by using the registration prompts, check-in scripts and\nmessage templates Provider supplies. Client will give Provider access to the visit and\nregistration data in the Services needed to calculate the Active Portal Rate.\n11.4 Patient Messaging. Client is responsible for obtaining and recording patient consent\nto receive electronic messages as required by law. Provider will honor patient opt-out\nrequests received through the Services.\n11.5 Clinical Responsibility. The Services support administrative, scheduling and\ncommunications functions. They are not a medical device and do not provide medical\nadvice, diagnosis or treatment. Clinical decisions remain the responsibility of Client's\nclinicians.\n11.6 Provider Count. Client will notify Provider within 15 days after any change in the\nnumber of providers using the Services. Provider may request written confirmation of the\nnumber of active providers no more than twice per year.\n12. Security and Business Continuity\n12.1 Safeguards. Provider will maintain a written information security program with\nadministrative, technical and physical safeguards appropriate for PHI, including\nencryption of Client Data in transit (TLS 1.2 or higher) and at rest (AES-256 or equivalent),\nrole-based access controls, multi-factor authentication for administrative access, logging\nof access to PHI, and security training for personnel with access to PHI.\n12.2 Hosting Location. Provider will host Client Data in the United States and will not\npermit access to PHI from outside the United States without Client's prior written\nconsent.\n12.3 Assessments. Provider will obtain a SOC 2 Type II report and an independent\npenetration test each year, and will provide the current SOC 2 report to Client on request,\nno more than once per year, as confidential information.\n12.4 Backup and Recovery. Provider will take encrypted backups of Client Data at least\ndaily and maintain a disaster recovery plan with a recovery point objective of 24 hours\nand a recovery time objective of 24 hours.\n12.5 Security Incidents. Provider will notify Client without unreasonable delay, and in any\nevent within 72 hours after confirming a Security Incident affecting Client Data, and will\ngive Client the information required by the Business Associate Agreement and cooperate\nin remediation.\n12.6 Security Questionnaire. Once per year, Provider will answer a reasonable written\nsecurity questionnaire from Client within 30 days.\n\n[[Page 5]]\n13. Warranties and Disclaimers\n13.1 Provider Warranties. Provider warrants that (a) the Services will perform materially in\naccordance with the Documentation; (b) implementation and support services will be\nperformed in a professional manner; (c) Provider will not knowingly introduce malicious\ncode; and (d) Provider will comply with the laws that apply to its provision of the Services,\nincluding HIPAA.\n13.2 Remedy. For a breach of Section 13.1(a), Provider will correct the problem or provide a\nworkaround within a reasonable time. If it cannot do so within 45 days after written\nnotice, Client may terminate the affected Services and receive a refund of prepaid fees\nfor the period after termination.\n13.3 Client Warranty. Client warrants that it has the authority to enter into this\nAgreement and the rights needed to provide Client Data to Provider.\n13.4 Disclaimer. Except as expressly stated in this Agreement, the Services are provided\n\"as is.\" Provider disclaims all implied warranties, including merchantability, fitness for a\nparticular purpose and non-infringement, and does not warrant uninterrupted or error-\nfree operation.\n14. Indemnification\n14.1 By Provider. Provider will defend Client against any third-party claim alleging that the\nServices infringe a United States patent, copyright or trademark or misappropriate a trade\nsecret, and will pay damages finally awarded or agreed in settlement. Provider has no\nobligation to the extent a claim arises from Client Data, modifications not made by\nProvider, combinations with items Provider did not supply, or use in breach of this\nAgreement. Provider may procure the right to continue use, modify the Services, or\nterminate the affected Services and refund prepaid fees.\n14.2 By Client. Client will defend Provider against any third-party claim arising from Client\nData, Client's use of the Services in violation of law, patient messaging sent without\nrequired consent, or clinical care provided by Client, and will pay damages finally awarded\nor agreed in settlement.\n14.3 Procedure. The indemnified party will give prompt written notice, allow the\nindemnifying party sole control of the defense and settlement, and cooperate at the\nindemnifying party's expense.\n14.4 This Section 14 states each party's entire obligation and the other party's exclusive\nremedy for the claims it covers.\n\n[[Page 6]]\n15. Insurance\nDuring the term, Provider will maintain commercial general liability insurance of at least\n$2,000,000 per occurrence and $4,000,000 in the aggregate, technology errors and\nomissions and cyber liability insurance of at least $3,000,000 per claim, and workers'\ncompensation insurance as required by law. Provider will provide certificates of insurance\non request.\n16. Invoice Disputes and Suspension\n16.1 Disputes. If Client disputes an invoice in good faith, Client will notify Provider in\nwriting within 30 days after the invoice date, explain the basis and pay the undisputed\nportion on time.\n16.2 Suspension. If an undisputed amount is more than 30 days overdue, Provider may\nsuspend the Services after 10 days' further written notice. Provider will restore the\nServices within one Business Day after receiving payment and will allow Client to export\nits Client Data during any suspension.\n17. Regulatory Compliance\n17.1 HIPAA. Each party will comply with HIPAA and the HITECH Act as they apply to it.\nProvider is a business associate of Client.\n17.2 Exclusion. Provider represents that neither it nor any person performing the Services\nis excluded from participation in a federal health care program, and will notify Client\nwithin 5 business days if that changes. Client may terminate immediately if Provider is\nexcluded.\n17.3 No Referrals. Nothing in this Agreement requires or is conditioned on the referral of\npatients or business. The fees, including any Adoption Incentive Fee, are consistent with\nfair market value for the Services and are not determined by the volume or value of\nreferrals, and neither party offers or receives remuneration to induce referrals.\n17.4 Accessibility. Provider will use reasonable efforts to keep patient-facing interfaces\nconsistent with WCAG 2.1 Level AA.\n18. Force Majeure\nNeither party is liable for a failure or delay caused by events beyond its reasonable\ncontrol, such as natural disasters, war, terrorism, government action, pandemics,\nwidespread utility or internet failures not caused by that party, and labor disputes other\n\n[[Page 7]]\nthan its own. This Section does not excuse payment obligations. If the event continues for\nmore than 30 days, the other party may terminate the affected Services without liability.\n19. Assignment and Subcontractors\n19.1 Neither party may assign this Agreement without the other's prior written consent,\nwhich will not be unreasonably withheld, except to a successor in a merger, acquisition or\nsale of substantially all of its related assets, on written notice, if the successor assumes\nall obligations in writing.\n19.2 Provider may use subcontractors but remains responsible for their performance. Any\nsubcontractor with access to PHI must be bound by a business associate agreement.\n20. Dispute Resolution\n20.1 Escalation. A party with a dispute will give written notice. Senior representatives of\nboth parties will meet within 15 days and try to resolve the dispute within 30 days after\nthe notice.\n20.2 Courts. If the dispute is not resolved, the state and federal courts located in\nDelaware have exclusive jurisdiction, and each party consents to that jurisdiction. To the\nextent the law allows, each party waives trial by jury.\n20.3 Equitable Relief; Continued Performance. Either party may seek injunctive relief at\nany time to protect its confidential information or intellectual property. Unless this\nAgreement has been terminated, both parties will continue to perform during a dispute.\n21. General Provisions\n21.1 Governing Law. This Agreement is governed by the laws of the State of Delaware,\nwithout regard to its conflict-of-laws rules.\n21.2 Entire Agreement; Order of Precedence. This Agreement, including its Exhibits and\nthe Business Associate Agreement, is the entire agreement of the parties on its subject\nmatter and replaces all earlier proposals and agreements. If documents conflict, the order\nof precedence is: any signed amendment, the Business Associate Agreement (for PHI),\nthe body of this Agreement, and then the Exhibits.\n21.3 Amendment and Waiver. An amendment must be in writing and signed by both\nparties. A waiver is effective only if in writing, and a waiver of one breach does not waive\nany other.\n\n[[Page 8]]\n21.4 Notices. Notices must be in writing and delivered by hand, by nationally recognized\ncourier, or by email with confirmation of receipt, to the contacts in Exhibit E. Notices of\nbreach, non-renewal or termination must be sent by courier, with a copy by email. A notice\nis effective on receipt.\n21.5 Independent Contractors; No Third-Party Beneficiaries. The parties are\nindependent contractors. This Agreement confers no rights on any third party.\n21.6 Publicity. Neither party will use the other's name or logo in marketing without prior\nwritten consent.\n21.7 Severability. If a provision is held unenforceable, it will be enforced to the extent\npermitted and the rest of this Agreement remains in effect.\n21.8 Survival. Provisions that by their nature should survive termination will survive,\nincluding accrued payment obligations, any earned Adoption Incentive Fee, and Sections\n6.3, 7, 8, 9, 10, 14, 20 and 21.\n21.9 Counterparts; Electronic Signatures. This Agreement may be signed in counterparts\nand by electronic signature, each of which is an original.\nSignatures\nMediLink Systems, Inc. By: Dana Whitfield, Chief Executive Officer Date: June 1, 2026\nMaple Street Family Medicine, LLC By: Dr. Marcus Hale, Managing Physician Date: June 1,\n2026\nExhibit A: Definitions\nBusiness Associate Agreement: the agreement between the parties governing\nProvider's use and disclosure of PHI.\nBusiness Day: a day other than a Saturday, Sunday or U.S. federal holiday.\nClient Data: all data, including PHI, that Client or its users enter into or generate\nthrough the Services.\nDocumentation: Provider's user guides and technical documentation for the Services,\nas updated from time to time.\nGo-Live: the first day Client uses the Services in production to register or schedule\npatients.\nActivated Portal Account: a patient portal account for which the patient has\ncompleted registration and identity verification.\n\n[[Page 9]]\nSecurity Incident: unauthorized access to, or acquisition, use or disclosure of, Client\nData in Provider's possession or control.\nExhibit B: Services Description and Support\nB.1 Included Services\nPatient registration and demographics\nAppointment scheduling and online booking\nPatient portal, including secure messaging, intake forms and visit summaries\nAppointment reminders by text and email\nStandard reports and dashboards\nOnboarding training: up to 6 hours, delivered virtually\nB.2 Support\nProvider provides support Monday to Friday, 8:00 a.m. to 6:00 p.m. Eastern Time, excluding\nU.S. federal holidays, by phone, email and web portal.\nThese times are targets and do not create service credits.\nB.3 Maintenance\nProvider performs scheduled maintenance on Saturdays between 10:00 p.m. and 2:00 a.m.\nEastern Time, with at least 3 days' notice.\nSeverity Definition Response Target resolution or\nworkaround\n1 Services unavailable 1 hour, any\ntime\n8 hours\n2 Major function degraded,\nworkaround exists\n4 business\nhours\n2 Business Days\n3 Minor function affected 1 Business Day 7 Business Days\n4 Question or enhancement request 2 Business\nDays\nNext scheduled release\n\n[[Page 10]]\nExhibit C: Fee Schedule (as of the Effective\nDate)\nC.1 Recurring Fees\nC.2 One-Time and Conditional Fees\nC.3 Invoicing\nInvoices are payable within 30 days of the invoice date and are sent by email to the billing\ncontact in Exhibit E.\nItem Amount Billing\nSubscription Fee, 4\nproviders\n$425 per provider per month\n($1,700 per month)\nStub invoice for June 2026 on\nthe Effective Date; then\nquarterly in advance ($5,100 per\nquarter) on July 1, October 1,\nJanuary 1 and April 1\nAnnual increase 3% on each anniversary, first on\nJune 1, 2027\nApplied to the per-provider fee\nItem Amount Billing\nImplementation Fee $6,000 $3,000 upon signing; $3,000 upon Go-\nLive\nAdoption Incentive Fee, Active Portal\nRate 60% to under 75%\n$8,000 Invoiced within 15 days after the\nMeasurement Date\nAdoption Incentive Fee, Active Portal\nRate 75% or more\n$12,000 Invoiced within 15 days after the\nMeasurement Date\nAdoption Incentive Fee, Active Portal\nRate under 60%\nNone Not applicable\n\n[[Page 11]]\nExhibit D: Adoption Measurement\nMethodology\nD.1 Calculation\nThe Active Portal Rate is calculated to one decimal place, without rounding up, as:\n\\text{Active Portal Rate} = \\frac{\\text{unique patients with a completed \nvisit in the 6 months ending on the Measurement Date who hold an Activated \nPortal Account on that date}}{\\text{all unique patients with a completed \nvisit in the same 6 months}}\nD.2 Data Sources\nA visit counts when the appointment is marked completed in the scheduling module.\nA patient counts once, regardless of the number of visits.\nPortal activation status is taken from Provider's system as of the end of the\nMeasurement Date.\nD.3 Report and Review\nProvider will deliver a written report showing the numerator, denominator and resulting\nrate within 10 days after the Measurement Date. Client has 10 days after receiving the\nreport to dispute it in writing. The parties will review the underlying data together and try\nto resolve any dispute within 15 days. If they cannot, they will ask an independent\nreviewer they both accept to recalculate the rate from the system data, and that result is\nfinal. Provider invoices the undisputed Adoption Incentive Fee according to Section 3.4\nwhile any dispute is resolved.\nExhibit E: Notice Details and Contacts\nRole Provider Client\nLegal\nnotices\nGeneral Counsel, MediLink\nSystems, Inc., 500 Innovation Way,\nSuite 300, Wilmington, Delaware\n19801; legal@medilink.example\nManaging Physician, Maple Street\nFamily Medicine, LLC, 214 Maple\nStreet; office@maplestreetfm.example\nBilling billing@medilink.example billing@maplestreetfm.example\n\n[[Page 12]]\nAmendment No. 1\nSample amendment for testing purposes only.\nThis Amendment No. 1 is dated November 15, 2026 and amends the Subscription\nAgreement dated June 1, 2026 between MediLink Systems, Inc. and Maple Street Family\nMedicine, LLC. Capitalized terms have the meanings given in the Agreement.\n1. Additional Provider\n1.1 Client adds one (1) additional provider effective December 1, 2026, bringing the total\nto 5 providers.\n1.2 The additional provider will be charged at a discounted rate of $375 per month, in place\nof the rate in Section 3.2 of the Agreement. The discounted rate is subject to the annual\nincrease in Section 3.3 of the Agreement.\n1.3 The Additional Provider Fee for December 2026 will be invoiced with the January 1,\n2027 quarterly invoice. From January 2027, the Additional Provider Fee is included in each\nquarterly invoice.\n2. Go-Live and Measurement Date\n2.1 The parties confirm that Go-Live occurred on September 15, 2026.\n2.2 Section 3.4 of the Agreement is amended so that the Measurement Date is March 15,\n2027. All other terms of Section 3.4, including the fee tiers, remain unchanged. Provider\nwill deliver the measurement report and invoice any Adoption Incentive Fee within 15 days\nafter the new Measurement Date.\n3. Other Terms\nExcept as stated in this Amendment, the Agreement remains in full effect. If this\nAmendment conflicts with the Agreement, this Amendment controls.\nMediLink Systems, Inc. By: Dana Whitfield, Chief Executive Officer Date: November 15,\n2026\nRole Provider Client\nTechnical\nand security\nsecurity@medilink.example manager@maplestreetfm.example\n\n[[Page 13]]\nMaple Street Family Medicine, LLC By: Dr. Marcus Hale, Managing Physician Date:\nNovember 15, 2026","documents":[{"id":"d1","name":"Contract_3_-_Maple_Street_Family_Medicine_with_Amendment.pdf","kind":"original","addedAt":"2026-10-06T09:00:00.000Z"},{"id":"d2","name":"Amendment No. 1 (pages 12-13)","kind":"amendment","addedAt":"2026-11-15T09:00:00.000Z"}]},{"area":"customers","org":"NorthPoint Urgent Care Center, LLC","counterparty":"MediLink Systems, Inc.","contractType":"Services Agreement","industry":"Healthcare - Urgent care","startDate":"2026-10-01","endDate":"2027-09-30","autoRenew":false,"renewalNoticeDays":30,"annualValue":46500,"totalValue":46500,"maxBonus":0,"reviewState":"verified","riskLevel":"Medium","summary":"12-month online check-in and queue platform for an urgent care center.","fileName":"Contract_4_-_NorthPoint_Urgent_Care_Center.pdf","fields":{"counterpartyName":{"v":"NorthPoint Urgent Care Center, LLC","src":"NorthPoint Urgent Care Center, LLC lient may terminate for convenience on 30 days' written notice","page":2,"conf":"high","st":"verified"},"terminationFees":{"v":"Platform fee for the lesser of remaining months or three months","src":"the lesser of (a) the months remaining in the Initial Term or (b) three months","page":2,"conf":"high","st":"verified"},"curePeriod":{"v":"15 days","src":"fails to cure within 15 days","page":2,"conf":"high","st":"verified"},"liabilityCap":{"v":"Fees paid in the prior 12 months","src":"limited to the fees paid by Client in the 12 months","page":3,"conf":"high","st":"verified"},"governingLaw":{"v":"Delaware","src":"governed by the laws of the State of Delaware","page":7,"conf":"high","st":"verified"},"annualValue":{"v":46500,"src":"Client will pay a monthly Platform Fee of $3,500","page":1,"conf":"medium","st":"verified"},"totalValue":{"v":46500,"src":"Client will pay a monthly Platform Fee of $3,500","page":1,"conf":"medium","st":"verified"}},"obligations":[{"id":"ex0","side":"theirs","text":"Pay second implementation installment at Go-Live","category":"Payment","due":"2026-11-16","recurrence":"One-time","amount":2250,"src":"50% ($2,250) upon Go-Live","page":1,"status":"open","conditional":false,"condition":"","graceDays":null,"lateTerms":"1.5% per month late charge","owner":"","note":""},{"id":"ex1","side":"theirs","text":"Pay monthly platform and visit fees by ACH (minimum $4,200)","category":"Payment","due":"2026-12-16","recurrence":"Monthly","amount":4200,"src":"the total of the Platform Fee, Additional Location fees and Visit Fees for a month will not be less than $4,200","page":2,"status":"open","conditional":false,"condition":"","graceDays":null,"lateTerms":"1.5% per month; service may be suspended 15 days after notice","owner":"","note":"","until":"2027-09-30"},{"id":"ex2","side":"theirs","text":"Keep a valid ACH authorization; give 10 days' notice before bank changes","category":"Compliance","due":null,"recurrence":"Ongoing","amount":null,"src":"Client will keep a valid ACH authorization in place for the term","page":4,"status":"open","conditional":false,"condition":"","graceDays":null,"lateTerms":"","owner":"","note":""},{"id":"ex3","side":"theirs","text":"Check in every patient visit through the system; no split or suppressed check-ins","category":"Compliance","due":null,"recurrence":"Ongoing","amount":null,"src":"Client will not split, duplicate or suppress check-ins","page":4,"status":"open","conditional":false,"condition":"","graceDays":null,"lateTerms":"","owner":"","note":""},{"id":"ex4","side":"mine","text":"Go live at the initial location","category":"Delivery","due":"2026-11-01","recurrence":"One-time","amount":null,"src":"The target date for Go-Live is November 1, 2026","page":1,"status":"open","conditional":false,"condition":"","graceDays":null,"lateTerms":"","owner":"","note":""},{"id":"ex5","side":"mine","text":"Provide support 7 days a week, 7am-11pm ET; Severity 1 response in 30 minutes","category":"Service level","due":null,"recurrence":"Ongoing","amount":null,"src":"Provider provides support seven days a week","page":9,"status":"open","conditional":false,"condition":"","graceDays":null,"lateTerms":"","owner":"","note":""},{"id":"ex6","side":"mine","text":"Send visit report by date and location within 30 days of a request","category":"Reporting","due":null,"recurrence":"Ongoing","amount":null,"src":"Client may request a report of registered visits by date and location","page":6,"status":"open","conditional":false,"condition":"","graceDays":null,"lateTerms":"","owner":"","note":""}],"sourceText":"[[Page 1]]\nServices Agreement\nCareConnect Patient Management Platform: NorthPoint Urgent Care Center\nSample contract for testing purposes only. All parties are fictional. Not legal advice.\nThis Agreement is entered into as of October 1, 2026 (the \"Effective Date\") between\nMediLink Systems, Inc., a Delaware corporation (\"Provider\"), and NorthPoint Urgent\nCare Center, LLC, an urgent care operator (\"Client\").\n1. Services\n1.1 Provider grants Client access to the CareConnect platform, including online check-in,\nwalk-in queue management, patient registration, visit records and reporting (the\n\"Services\"), for Client's one location at signing (the \"Initial Location\").\n1.2 The target date for Go-Live is November 1, 2026.\n1.3 Client may add locations by signed Order Form. Each additional location is charged at\nthe Additional Location rate in Section 3.3.\n2. Term\n2.1 Initial Term. The Initial Term is 12 months, from October 1, 2026 through September 30,\n2027.\n2.2 After the Initial Term. This Agreement does not renew automatically for a fixed term.\nAfter the Initial Term it continues month to month, and either party may terminate on 30\ndays' written notice.\n3. Fees\n3.1 Implementation Fee. Client will pay a one-time Implementation Fee of $4,500: 50%\n($2,250) upon signing and 50% ($2,250) upon Go-Live.\n3.2 Platform Fee. Client will pay a monthly Platform Fee of $3,500 for the Initial Location.\nAs a launch promotion, the Platform Fee is waived for October and November 2026 and\nbegins on December 1, 2026.\n3.3 Additional Locations. Each additional location costs $2,800 per month, beginning on\nthe date stated in the Order Form.\n3.4 Visit Fees. The Platform Fee includes up to 1,500 registered visits per month across\nall locations. Visits above that are charged on a marginal basis:\n\n[[Page 2]]\nVisits 1,501 to 3,000 in a month: $1.80 per visit\nVisits above 3,000 in a month: $1.20 per visit\n3.5 Minimum Monthly Fee. From December 1, 2026, the total of the Platform Fee,\nAdditional Location fees and Visit Fees for a month will not be less than $4,200. If the\ntotal is lower, Client will pay the difference.\n3.6 Rate Changes. After the Initial Term, Provider may change any rate on 60 days' written\nnotice.\n4. Billing and Payment\n4.1 The Platform Fee and Additional Location fees are invoiced monthly in advance on the\nfirst day of each month. Visit Fees and any Minimum Monthly Fee shortfall are invoiced\nmonthly in arrears within 10 days after month end.\n4.2 Invoices are payable within 15 days by ACH autopay. Overdue amounts accrue a late\ncharge of 1.5% per month.\n5. Service Levels\n5.1 Provider will use commercially reasonable efforts to make the Services available 99.0%\nof each month.\n5.2 If availability falls below 99.0% in a month, Client will receive a credit of 10% of that\nmonth's Platform Fee.\n6. Termination\n6.1 For Cause. Either party may terminate on written notice if the other party materially\nbreaches this Agreement and fails to cure within 15 days.\n6.2 For Convenience during the Initial Term. Client may terminate for convenience on 30\ndays' written notice. Client will pay the Platform Fee for the lesser of (a) the months\nremaining in the Initial Term or (b) three months, starting from the termination date.\n6.3 On termination, Provider will return Client's data in a standard format within 30 days.\n7. Data Protection\nThe parties will sign Provider's standard Business Associate Agreement, which governs\nprotected health information.\n\n[[Page 3]]\n8. Confidentiality\nEach party will protect the other's confidential information with at least reasonable care\nand use it only to perform this Agreement.\n9. Limitation of Liability\nEach party's total liability under this Agreement is limited to the fees paid by Client in the\n12 months before the claim arose. Neither party is liable for indirect or consequential\ndamages.\n10. Intellectual Property and Data Rights\n10.1 Provider Property. Provider and its licensors own all right, title and interest in the\nServices, the CareConnect software, the Documentation and all improvements to them.\nClient receives only the limited right to use the Services during the term.\n10.2 Client Data. Client owns all Client Data, including protected health information\n(\"PHI\"). Client grants Provider a limited, non-exclusive license to host, process and\ntransmit Client Data solely to provide the Services and support, and as permitted by the\nBusiness Associate Agreement.\n10.3 De-identified Data. Provider may create de-identified data only as permitted by the\nBusiness Associate Agreement and 45 C.F.R. \u00a7 164.514, and may use it only to operate,\nsecure and improve the Services. Provider will not re-identify it or sell it.\n10.4 Restrictions. Client will not copy or modify the Services, reverse engineer them\nexcept where law permits, resell or sublicense them, circumvent security or usage limits,\nor use them to send unlawful or unsolicited messages.\n10.5 Feedback. Provider may use Client's suggestions about the Services without\nobligation, provided it does not disclose Client's confidential information or PHI.\n11. Client Responsibilities\n11.1 Client will name an administrator who can approve configuration decisions and\nmanage user accounts at each location.\n11.2 Client is responsible for the accuracy and lawfulness of Client Data and for its users'\ncompliance with this Agreement. Client will keep credentials confidential and deactivate\naccounts of departed staff promptly.\n\n[[Page 4]]\n11.3 Registered Visits. Client will use the Services' check-in and registration workflow for\neach patient visit so that visits are recorded accurately. Client will not split, duplicate or\nsuppress check-ins to change the Visit Fees.\n11.4 Payment Method. Client will keep a valid ACH authorization in place for the term and\nwill notify Provider at least 10 days before changing bank account details.\n11.5 Patient Messaging. Client is responsible for obtaining and recording patient consent\nto receive electronic messages as required by law. Provider will honor patient opt-out\nrequests received through the Services.\n11.6 Clinical Responsibility. The Services support administrative, queue-management and\ncommunications functions. They are not a medical device, do not triage patients, and do\nnot provide medical advice, diagnosis or treatment. Clinical decisions remain the\nresponsibility of Client's clinicians.\n12. Security and Business Continuity\n12.1 Safeguards. Provider will maintain a written information security program with\nadministrative, technical and physical safeguards appropriate for PHI, including\nencryption of Client Data in transit (TLS 1.2 or higher) and at rest (AES-256 or equivalent),\nrole-based access controls, multi-factor authentication for administrative access, logging\nof access to PHI, and security training for personnel with access to PHI.\n12.2 Hosting Location. Provider will host Client Data in the United States and will not\npermit access to PHI from outside the United States without Client's prior written\nconsent.\n12.3 Assessments. Provider will obtain a SOC 2 Type II report and an independent\npenetration test each year, and will provide the current SOC 2 report to Client on request,\nno more than once per year, as confidential information.\n12.4 Backup and Recovery. Provider will take encrypted backups of Client Data at least\ndaily and maintain a disaster recovery plan with a recovery point objective of 12 hours and\na recovery time objective of 12 hours.\n12.5 Security Incidents. Provider will notify Client without unreasonable delay, and in any\nevent within 72 hours after confirming a Security Incident affecting Client Data, and will\ngive Client the information required by the Business Associate Agreement and cooperate\nin remediation.\n12.6 Security Questionnaire. Once per year, Provider will answer a reasonable written\nsecurity questionnaire from Client within 30 days.\n\n[[Page 5]]\n13. Warranties and Disclaimers\n13.1 Provider Warranties. Provider warrants that (a) the Services will perform materially in\naccordance with the Documentation; (b) implementation and support services will be\nperformed in a professional manner; (c) Provider will not knowingly introduce malicious\ncode; and (d) Provider will comply with the laws that apply to its provision of the Services,\nincluding HIPAA.\n13.2 Remedy. For a breach of Section 13.1(a), Provider will correct the problem or provide a\nworkaround within a reasonable time. If it cannot do so within 30 days after written\nnotice, Client may terminate the affected Services without the payment described in\nSection 6.2 and receive a refund of prepaid fees for the period after termination.\n13.3 Client Warranty. Client warrants that it has the authority to enter into this\nAgreement and the rights needed to provide Client Data to Provider.\n13.4 Disclaimer. Except as expressly stated in this Agreement, the Services are provided\n\"as is.\" Provider disclaims all implied warranties, including merchantability, fitness for a\nparticular purpose and non-infringement, and does not warrant uninterrupted or error-\nfree operation.\n14. Indemnification\n14.1 By Provider. Provider will defend Client against any third-party claim alleging that the\nServices infringe a United States patent, copyright or trademark or misappropriate a trade\nsecret, and will pay damages finally awarded or agreed in settlement. Provider has no\nobligation to the extent a claim arises from Client Data, modifications not made by\nProvider, combinations with items Provider did not supply, or use in breach of this\nAgreement. Provider may procure the right to continue use, modify the Services, or\nterminate the affected Services and refund prepaid fees.\n14.2 By Client. Client will defend Provider against any third-party claim arising from Client\nData, Client's use of the Services in violation of law, patient messaging sent without\nrequired consent, or clinical care provided by Client, and will pay damages finally awarded\nor agreed in settlement.\n14.3 Procedure. The indemnified party will give prompt written notice, allow the\nindemnifying party sole control of the defense and settlement, and cooperate at the\nindemnifying party's expense.\n14.4 This Section 14 states each party's entire obligation and the other party's exclusive\nremedy for the claims it covers.\n\n[[Page 6]]\n15. Insurance\nDuring the term, Provider will maintain commercial general liability insurance of at least\n$2,000,000 per occurrence and $4,000,000 in the aggregate, technology errors and\nomissions and cyber liability insurance of at least $3,000,000 per claim, and workers'\ncompensation insurance as required by law. Provider will provide certificates of insurance\non request.\n16. Invoice Disputes, Suspension and Visit Verification\n16.1 Disputes. If Client disputes an invoice in good faith, Client will notify Provider in\nwriting within 30 days after the invoice date, explain the basis and pay the undisputed\nportion on time.\n16.2 Suspension. If a payment fails and remains unpaid for 15 days after Provider's written\nnotice, Provider may suspend the Services. Provider will restore the Services within 4\nhours after receiving payment and will allow Client to export its Client Data during any\nsuspension.\n16.3 Visit Verification. The visit counts in Provider's system are the basis for Visit Fees\nunless there is a manifest error. Within 30 days after receiving a Visit Fee invoice, Client\nmay request a report of registered visits by date and location. The parties will correct any\nerror found, and any resulting credit or additional charge will appear on the next invoice.\n17. Regulatory Compliance\n17.1 HIPAA. Each party will comply with HIPAA and the HITECH Act as they apply to it.\nProvider is a business associate of Client.\n17.2 Exclusion. Provider represents that neither it nor any person performing the Services\nis excluded from participation in a federal health care program, and will notify Client\nwithin 5 business days if that changes. Client may terminate immediately if Provider is\nexcluded.\n17.3 No Referrals. Nothing in this Agreement requires or is conditioned on the referral of\npatients or business. The fees, including the Visit Fees, are consistent with fair market\nvalue for the Services, and neither party offers or receives remuneration to induce\nreferrals.\n17.4 Accessibility. Provider will use reasonable efforts to keep patient-facing interfaces\nconsistent with WCAG 2.1 Level AA.\n\n[[Page 7]]\n18. Force Majeure\nNeither party is liable for a failure or delay caused by events beyond its reasonable\ncontrol, such as natural disasters, war, terrorism, government action, pandemics,\nwidespread utility or internet failures not caused by that party, and labor disputes other\nthan its own. This Section does not excuse payment obligations. If the event continues for\nmore than 30 days, the other party may terminate the affected Services without liability.\n19. Assignment and Subcontractors\n19.1 Neither party may assign this Agreement without the other's prior written consent,\nwhich will not be unreasonably withheld, except to a successor in a merger, acquisition or\nsale of substantially all of its related assets, on written notice, if the successor assumes\nall obligations in writing.\n19.2 Provider may use subcontractors but remains responsible for their performance. Any\nsubcontractor with access to PHI must be bound by a business associate agreement.\n20. Dispute Resolution\n20.1 Escalation. A party with a dispute will give written notice. Senior representatives of\nboth parties will meet within 10 days and try to resolve the dispute within 20 days after\nthe notice.\n20.2 Courts. If the dispute is not resolved, the state and federal courts located in\nDelaware have exclusive jurisdiction, and each party consents to that jurisdiction. To the\nextent the law allows, each party waives trial by jury.\n20.3 Equitable Relief; Continued Performance. Either party may seek injunctive relief at\nany time to protect its confidential information or intellectual property. Unless this\nAgreement has been terminated, both parties will continue to perform during a dispute.\n21. General Provisions\n21.1 Governing Law. This Agreement is governed by the laws of the State of Delaware,\nwithout regard to its conflict-of-laws rules.\n21.2 Entire Agreement; Order of Precedence. This Agreement, including its Exhibits, any\nOrder Forms and the Business Associate Agreement, is the entire agreement of the\nparties on its subject matter and replaces all earlier proposals and agreements. If\ndocuments conflict, the order of precedence is: the Business Associate Agreement (for\nPHI), the body of this Agreement, the Exhibits, and then Order Forms, unless an Order\nForm expressly states that it overrides a specific Section.\n\n[[Page 8]]\n21.3 Amendment and Waiver. An amendment must be in writing and signed by both\nparties. A waiver is effective only if in writing, and a waiver of one breach does not waive\nany other.\n21.4 Notices. Notices must be in writing and delivered by hand, by nationally recognized\ncourier, or by email with confirmation of receipt, to the contacts in Exhibit E. Notices of\nbreach or termination must be sent by courier, with a copy by email. A notice is effective\non receipt.\n21.5 Independent Contractors; No Third-Party Beneficiaries. The parties are\nindependent contractors. This Agreement confers no rights on any third party.\n21.6 Publicity. Neither party will use the other's name or logo in marketing without prior\nwritten consent.\n21.7 Severability. If a provision is held unenforceable, it will be enforced to the extent\npermitted and the rest of this Agreement remains in effect.\n21.8 Survival. Provisions that by their nature should survive termination will survive,\nincluding accrued payment obligations and Sections 6.3, 7, 8, 9, 10, 14, 20 and 21.\n21.9 Counterparts; Electronic Signatures. This Agreement may be signed in counterparts\nand by electronic signature, each of which is an original.\nSignatures\nMediLink Systems, Inc. By: Dana Whitfield, Chief Executive Officer Date: October 1, 2026\nNorthPoint Urgent Care Center, LLC By: Elena Brooks, Chief Operating Officer Date:\nOctober 1, 2026\nExhibit A: Definitions\nBusiness Associate Agreement: the agreement between the parties governing\nProvider's use and disclosure of PHI.\nBusiness Day: a day other than a Saturday, Sunday or U.S. federal holiday.\nClient Data: all data, including PHI, that Client or its users enter into or generate\nthrough the Services.\nDocumentation: Provider's user guides and technical documentation for the Services,\nas updated from time to time.\nGo-Live: the first day Client uses the Services in production at the Initial Location to\ncheck in patients.\nOrder Form: a signed document that adds locations or services under this Agreement.\n\n[[Page 9]]\nRegistered Visit: a patient check-in record created in the Services for a single patient\non a single date at a location. Cancelled check-ins, duplicate records for the same visit\nand test records are not Registered Visits.\nSecurity Incident: unauthorized access to, or acquisition, use or disclosure of, Client\nData in Provider's possession or control.\nExhibit B: Services Description and Support\nB.1 Included Services\nOnline check-in and wait-time display\nWalk-in queue management and patient texting when a room is ready\nPatient registration, insurance capture and visit records\nStandard reports on visits, wait times and throughput\nOnboarding training: up to 4 hours, delivered virtually\nB.2 Support\nBecause Client operates extended hours, Provider provides support seven days a week,\n7:00 a.m. to 11:00 p.m. Eastern Time, by phone, email and web portal. Severity 1 issues may\nbe reported at any time through an on-call line.\nThese times are targets and do not create service credits. Service credits are governed\nsolely by Section 5.\nSeverity Definition Response Target resolution or\nworkaround\n1 Check-in unavailable at any\nlocation\n30 minutes, any\ntime\n4 hours\n2 Major function degraded,\nworkaround exists\n2 hours 1 Business Day\n3 Minor function affected 1 Business Day 5 Business Days\n4 Question or enhancement\nrequest\n2 Business Days Next scheduled release\n\n[[Page 10]]\nB.3 Maintenance\nProvider performs scheduled maintenance between 2:00 a.m. and 4:00 a.m. Eastern Time,\nwith at least 3 days' notice. Scheduled maintenance is excluded from the availability\ncalculation in Section 5.\nExhibit C: Fee Schedule\nC.1 Recurring and Usage Fees\nC.2 One-Time Charges\nItem Amount Starts Billing\nPlatform Fee, Initial\nLocation\n$3,500 per month December 1, 2026\n(waived for October\nand November 2026)\nMonthly in\nadvance\nAdditional location $2,800 per month Date in the Order Form Monthly in\nadvance\nVisit Fee, Registered\nVisits 1,501 to 3,000 per\nmonth\n$1.80 per visit December 1, 2026 Monthly in\narrears\nVisit Fee, Registered\nVisits above 3,000 per\nmonth\n$1.20 per visit December 1, 2026 Monthly in\narrears\nMinimum Monthly Fee $4,200 (all fees for\nthe month\ncombined)\nDecember 1, 2026 Shortfall\ninvoiced\nmonthly in\narrears\nItem Amount Billing\nImplementation Fee $4,500 $2,250 upon signing; $2,250\nupon Go-Live\nEarly termination payment\n(Section 6.2)\nPlatform Fee for up to\nthree months\nUpon termination\n\n[[Page 11]]\nC.3 Worked Examples (one location, from December 2026)\nC.4 Invoicing\nThe Platform Fee is invoiced on the first day of each month. Visit Fees and any Minimum\nMonthly Fee shortfall are invoiced within 10 days after month end. Payment is due within\n15 days by ACH autopay. Invoices are sent by email to the billing contact in Exhibit E.\nExhibit D: Implementation Plan\nProvider's target dates depend on Client's timely access to staff and information. Fee\nstart dates are set by Section 3 and Exhibit C.\nRegistered Visits\nin the month\nVisit Fees Platform Fee\nplus Visit Fees\nAmount payable\n1,200 $0 $3,500 $4,200 (the Minimum\nMonthly Fee applies)\n2,300 800 visits at $1.80 =\n$1,440\n$4,940 $4,940\n3,400 1,500 visits at $1.80 +\n400 visits at $1.20 =\n$3,180\n$6,680 $6,680\nStep Activities Target\n1. Kickoff Confirm hours, room   // ---------- review ----------

  // ---------- search ----------

    const words = norm(q).split(" ").filter((w) => w.length > 2); if (!words.length) return [];
    const out = [];
    for (const c of list) {
      const parts = (c.sourceText || "").split(/\[\[Page (\d+)\]\]/);
      for (let i = 1; i < parts.length; i += 2) {
        const page = Number(parts[i]), body = parts[i + 1] || "", nb = body.toLowerCase();
        let score = 0, pos = -1; for (const w of words) { const p = nb.indexOf(w); if (p >= 0) { score++; if (pos < 0) pos = p; } }
        if (score && score >= Math.min(2, words.length)) out.push({ cid: c.id, org: c.org, area: c.area, page, score, text: body.slice(Math.max(0, pos - 140), Math.min(body.length, pos + 220)).replace(/\s+/g, " ").trim(), quote: body.slice(pos, Math.min(body.length, pos + 80)).replace(/\s+/g, " ").trim() });

  function pageSearch() {

  }
  // ---------- reports module ----------
  const REPORTS = [
    ["commitments", "Commitments report", "Everything we must pay or do, by due date and counterparty."],
    ["entitlements", "Entitlements report", "Everything others must pay or do for us, by due date and counterparty."],

    ["bonuses", "Bonuses, incentives and credits", "Conditional payments and the conditions that trigger them."],
    ["exit", "Exit terms summary", "Termination rights, notice periods, fees and cure periods by contract."],
    ["inventory", "Contract inventory", "All contracts with tab, counterparty, term, status and verification state."],
    ["hrterms", "HR terms summary", "Notice periods, bonuses, benefits and review dates (HR and Administrator only)."],
    ["access", "Access and activity report", "Who can access what, and recent views, downloads and changes (Administrator only)."],
  ];
  function reportContracts(f) {
    return V().filter((c) => (!f.area || c.area === f.area) && (!f.cp || c.org === f.cp) && (!f.status || status(c) === f.status) && (!f.verifiedOnly || reviewState(c) === "verified"));
  }
  const fvx = (c, k) => { const d = fieldDef(c.area, k); const v = fmtVal(d, fv(c, k), c.currency); const st = fst(c, k); return st === "verified" || st === "notfound" || st === "rejected" ? v : v + " (unverified)"; };
  function buildReport(key, f) {
    const list = reportContracts(f);
    const meta = { key, title: REPORTS.find((r) => r[0] === key)?.[1] || key, generatedAt: new Date().toISOString(), filters: { ...f }, sections: [], notes: [] };
    const unv = list.some((c) => reviewState(c) !== "verified");
    const partyOK = (side) => f.party === "both" || (f.party === "us" ? side === "mine" : side === "theirs");
    switch (key) {
      case "commitments": case "entitlements": {
        const side = key === "commitments" ? "mine" : "theirs", S = SIDE[side];
        const os = allObligations(list).filter((o) => o.side === side && o.state !== "done" && (o.state === "overdue" || o.state === "disputed" || (o.due && o.due >= f.from && o.due <= f.to)));
        meta.title = S.label + " report";
        meta.sections.push({ title: S.label + " by due date", columns: ["Due date", "Status", "Counterparty", "Tab", S.one, "Type", "Amount", "Fixed / conditional", "Owner", "Source"],
          rows: os.map((o) => [o.due ? fmtD(o.due) : "—", OB_ST[o.state], o.c.org, AREAS[o.c.area].label, o.text, o.category, num(o.amount), num(o.amount) === null ? "" : o.conditional ? "Conditional" : "Fixed", o.owner || "", o.page ? "p. " + o.page : "—"]),
          money: [false, false, false, false, false, false, true, false, false, false], total: { label: "Total", col: 6, fixed: os.filter((o) => !o.conditional).reduce((s, o) => s + (num(o.amount) || 0), 0), cond: os.filter((o) => o.conditional).reduce((s, o) => s + (num(o.amount) || 0), 0) } });
        const by = {}; for (const o of os) { const g = (by[o.c.org] ||= { org: o.c.org, n: 0, fixed: 0, cond: 0, next: "" }); g.n++; g[o.conditional ? "cond" : "fixed"] += num(o.amount) || 0; if (o.due && (!g.next || o.due < g.next)) g.next = o.due; }
        meta.sections.push({ title: "By counterparty", columns: ["Counterparty", "Items", "Fixed amount", "Conditional amount", "Next due"], rows: Object.values(by).sort((a, b) => b.fixed - a.fixed).map((g) => [g.org, g.n, g.fixed, g.cond, g.next ? fmtD(g.next) : "—"]), money: [false, false, true, true, false] });
        const ong = allObligations(list).filter((o) => o.side === side && o.state === "ongoing");
        if (ong.length) meta.sections.push({ title: "Ongoing (no date)", columns: ["Counterparty", S.one, "Type", "Source"], rows: ong.map((o) => [o.c.org, o.text, o.category, o.page ? "p. " + o.page : "—"]) });
        meta.notes.push(`Includes anything overdue, plus items due ${fmtD(f.from)} – ${fmtD(f.to)}. Conditional amounts are shown separately and never added to the fixed total.`);
        break;
      }
      case "forecast": {
        const dirs = [["in", "Entitlements (money in)", "theirs"], ["out", "Commitments (money out)", "mine"]].filter(([, , s]) => partyOK(s));
        const calcs = dirs.map(([d, l]) => [l, moneyCalc({ direction: d, from: f.from, to: f.to, list })]);
        const months = []; let m = f.from.slice(0, 7); for (let i = 0; i < 36 && m <= f.to.slice(0, 7); i++) { months.push(m); m = addMonths(m + "-01", 1).slice(0, 7); }
        const cols = ["Month", ...calcs.flatMap(([l]) => [l + " · fixed", l + " · conditional"])];
        const rows = months.map((mm) => [new Date(mm + "-01T00:00").toLocaleDateString(undefined, { month: "short", year: "numeric" }), ...calcs.flatMap(([, r]) => [r.lines.filter((x) => x.date.startsWith(mm) && !x.conditional).reduce((s, x) => s + x.amount, 0), r.lines.filter((x) => x.date.startsWith(mm) && x.conditional).reduce((s, x) => s + x.amount, 0)])]);
        rows.push(["Total", ...calcs.flatMap(([, r]) => [r.fixed, r.conditional])]);
        meta.sections.push({ title: "By month", columns: cols, rows, money: cols.map((_, i) => i > 0) });
        const byCp = {}; for (const [l, r] of calcs) for (const g of r.groups) { const k = g.org + "|" + l; (byCp[k] ||= { org: g.org, l, fixed: 0, cond: 0 }); byCp[k][g.conditional ? "cond" : "fixed"] += g.total; }
        meta.sections.push({ title: "By counterparty", columns: ["Counterparty", "Direction", "Fixed", "Conditional"], rows: Object.values(byCp).sort((a, b) => b.fixed + b.cond - a.fixed - a.cond).map((x) => [x.org, x.l, x.fixed, x.cond]), money: [false, false, true, true] });
        meta.sections.push({ title: "Calculation and sources", columns: ["Direction", "Counterparty", "Item", "Amount", "Times", "Total", "Type", "Source"], rows: calcs.flatMap(([l, r]) => r.groups.map((g) => [l, g.org, g.text, g.amount, g.n, g.total, g.conditional ? "Conditional: " + (g.condition || "") : "Fixed", g.page ? `p. ${g.page}: “${(g.src || "").slice(0, 90)}”` : "—"])), money: [false, false, false, true, false, true, false, false] });
        meta.notes.push("Calculated by the system from obligation amounts and dates. Conditional amounts are never added to fixed totals.");
        break;
      }
      case "renewals": {

        meta.sections.push({ title: "Renewal and notice dates", columns: ["Date", "Days left", "Counterparty", "Tab", "What", "Auto-renew", "Notice (days)", "Source"], rows: ds.map((d) => [fmtD(d.date), daysTo(d.date), d.c.org, AREAS[d.c.area].label, d.label, fvx(d.c, "autoRenew"), fvx(d.c, "renewalNoticeDays"), d.c.fields?.renewalNoticeDays?.page ? "p. " + d.c.fields.renewalNoticeDays.page : "—"]) });

        break;
      }
      case "bonuses": {
        const os = allObligations(list).filter((o) => o.conditional && partyOK(o.side));
        meta.sections.push({ title: "Conditional payments and duties", columns: ["Counterparty", "Kind", "Item", "Condition", "Claimable / payable", "Max amount", "Source"], rows: os.map((o) => [o.c.org, o.side === "mine" ? "Commitment" : "Entitlement", o.text, o.condition || "", o.due ? fmtD(o.due) : "—", num(o.amount), o.page ? `p. ${o.page}: “${(o.src || "").slice(0, 80)}”` : "—"]), money: [false, false, false, false, false, true, false] });
        const cf = list.filter((c) => fv(c, "conditionalPayments") || fv(c, "bonuses"));
        meta.sections.push({ title: "Contract terms", columns: ["Counterparty", "Tab", "Conditional terms", "Measurement date"], rows: cf.map((c) => [c.org, AREAS[c.area].label, c.area === "hr" ? fvx(c, "bonuses") : fvx(c, "conditionalPayments"), c.area === "customers" ? fvx(c, "measurementDate") : "—"]) });
        break;
      }
      case "exit": {
