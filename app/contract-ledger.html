<title>Contract Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
/* Layout: CRM workspace. Navy global header + object tabs; main workspace of cards (home, list views, record pages); an AI assistant docked on the right. */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --sunken: #f4f6fa;
  --fg: #172033;
  --muted: #5d6781;
  --line: #dde2ec;
  --head: #0f1d3a;
  --head-fg: #e8edf8;
  --head-muted: #9aa8c7;
  --accent: #2453c7;
  --accent-ink: #ffffff;
  --accent-soft: #e5ecfb;
  --ai: #6b3fd4;
  --ai-soft: #efe9fc;
  --ai-grad: linear-gradient(135deg, #2453c7, #6b3fd4);
  --series-1: #2a78d6;
  --ok: #1d7a46; --ok-soft: #e1f3e8;
  --warn: #935d00; --warn-soft: #fcf0d8;
  --bad: #b42318; --bad-soft: #fde5e2;
  --info: #2453c7; --info-soft: #e5ecfb;
  --shadow: 0 1px 2px rgba(15, 29, 58, .06), 0 2px 8px rgba(15, 29, 58, .05);
  --shadow-lg: 0 20px 50px rgba(15, 29, 58, .25);
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1220; --surface: #161d2e; --sunken: #1b2335; --fg: #e6eaf3; --muted: #9aa5bf; --line: #2a3349;
    --head: #080d18; --head-fg: #e6eaf3; --head-muted: #8592ad;
    --accent: #7ea2ff; --accent-ink: #0b1224; --accent-soft: #1d2a4a;
    --ai: #b39bff; --ai-soft: #2a2248; --ai-grad: linear-gradient(135deg, #4c74e8, #8a63f0);
    --series-1: #3987e5;
    --ok: #6fd39c; --ok-soft: #173426; --warn: #f0b45a; --warn-soft: #3a2b12; --bad: #f2867d; --bad-soft: #3d1c19; --info: #7ea2ff; --info-soft: #1d2a4a;
    --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 20px 50px rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1220; --surface: #161d2e; --sunken: #1b2335; --fg: #e6eaf3; --muted: #9aa5bf; --line: #2a3349;
  --head: #080d18; --head-fg: #e6eaf3; --head-muted: #8592ad;
  --accent: #7ea2ff; --accent-ink: #0b1224; --accent-soft: #1d2a4a;
  --ai: #b39bff; --ai-soft: #2a2248; --ai-grad: linear-gradient(135deg, #4c74e8, #8a63f0);
  --series-1: #3987e5;
  --ok: #6fd39c; --ok-soft: #173426; --warn: #f0b45a; --warn-soft: #3a2b12; --bad: #f2867d; --bad-soft: #3d1c19; --info: #7ea2ff; --info-soft: #1d2a4a;
  --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 20px 50px rgba(0,0,0,.55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }

/* app shell */
.app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
.gh { background: var(--head); color: var(--head-fg); display: flex; align-items: center; gap: 14px; padding: 10px 16px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; white-space: nowrap; }
.logo i { width: 28px; height: 28px; border-radius: 8px; background: var(--ai-grad); display: grid; place-items: center; font-style: normal; font-size: 13px; color: #fff; }
.gsearch { flex: 1; max-width: 560px; margin-inline: auto; position: relative; min-width: 0; }
.gsearch input { width: 100%; border: 1px solid transparent; background: rgba(255,255,255,.1); color: var(--head-fg); border-radius: 8px; padding: 8px 12px 8px 34px; }
.gsearch input::placeholder { color: var(--head-muted); }
.gsearch input:focus { background: rgba(255,255,255,.16); outline: none; border-color: var(--head-muted); }
.gsearch svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--head-muted); }
.gh-actions { display: flex; gap: 8px; }
.gbtn { border: 1px solid rgba(255,255,255,.18); background: transparent; color: var(--head-fg); border-radius: 8px; padding: 7px 12px; font-weight: 600; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.gbtn:hover { background: rgba(255,255,255,.08); }
.gbtn.ai { background: var(--ai-grad); border-color: transparent; color: #fff; }
.gbtn.ai[aria-pressed="true"] { box-shadow: 0 0 0 2px rgba(255,255,255,.5) inset; }
@media (max-width: 640px) { .gsearch { display: none; } .gbtn .t { display: none; } }

.nav { background: var(--surface); border-bottom: 1px solid var(--line); display: flex; gap: 2px; padding-inline: 12px; overflow-x: auto; }
.nav button { border: 0; background: none; padding: 11px 14px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.nav button[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }
.nav button:hover { color: var(--fg); }

.body { display: grid; grid-template-columns: minmax(0, 1fr) auto; min-height: 0; }
main { overflow-y: auto; padding-inline: 16px; padding-block: 16px 48px; min-width: 0; }
.page { max-width: 1280px; margin: 0 auto; display: grid; gap: 14px; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card > header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card > header h2 { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card .pad { padding: 14px 16px; }
.ico { width: 26px; height: 26px; border-radius: 7px; display: inline-grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; flex: none; }
.ico.c { background: #2f6fd6; } .ico.a { background: #1d8a6b; } .ico.d { background: #c4562b; } .ico.x { background: var(--ai-grad); }

.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head h1 { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 10px; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ai { background: var(--ai-soft); color: var(--ai); border-color: transparent; }
.btn.ai:hover { filter: brightness(.97); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

.banner { padding: 10px 14px; border-radius: var(--r); background: var(--warn-soft); border: 1px solid var(--line); }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; display: grid; gap: 2px; }
.kpi .v { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; overflow-wrap: anywhere; }
.kpi .s { color: var(--muted); font-size: 12px; }
@media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.grid-home { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.stack { display: grid; gap: 14px; min-width: 0; }
@media (max-width: 960px) { .grid-home { grid-template-columns: 1fr; } }

/* AI card */
.ai-card { border-color: transparent; background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--ai-grad) border-box; border: 1.5px solid transparent; }
.ai-out { white-space: pre-wrap; line-height: 1.55; }
.ai-out.dim { color: var(--muted); }
.spark { color: var(--ai); }

/* path */
.path { display: flex; gap: 3px; overflow-x: auto; }
.path .st { flex: 1 0 auto; min-width: 110px; padding: 9px 18px 9px 22px; background: var(--sunken); color: var(--muted); font-weight: 700; font-size: 13px; text-align: center; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%, 12px 50%); border: 0; white-space: nowrap; }
.path .st:first-child { clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%); border-radius: 8px 0 0 8px; }
.path .st:last-child { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 12px 50%); border-radius: 0 8px 8px 0; }
.path .st.done { background: var(--accent-soft); color: var(--accent); }
.path .st.cur { background: var(--accent); color: var(--accent-ink); }
.path .st .n { font-family: var(--f-mono); margin-left: 6px; opacity: .85; }
button.st:hover { filter: brightness(.96); }

/* chart */
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 34%) minmax(0, 1fr); gap: 10px; align-items: center; cursor: default; }
.bar-row .nm { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); }
.bar-track { display: flex; align-items: center; gap: 8px; min-width: 0; padding-block: 4px; }
.bar { height: 14px; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 2px; }
.bar-row:hover .bar { filter: brightness(1.1); }
.bar-row .val { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.tip { position: fixed; z-index: 40; background: var(--head); color: var(--head-fg); padding: 8px 10px; border-radius: 8px; font-size: 12px; pointer-events: none; box-shadow: var(--shadow-lg); max-width: 240px; }
.tip b { display: block; font-size: 13px; }

/* lists */
.mini { list-style: none; margin: 0; padding: 0; }
.mini li { display: grid; grid-template-columns: 108px minmax(0, 1fr) auto; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); align-items: baseline; cursor: pointer; }
.mini li:last-child { border-bottom: 0; }
.mini li:hover { background: var(--sunken); }
.mini .t { min-width: 0; }
.mini .num { white-space: nowrap; font-size: 13px; }
[hidden] { display: none !important; }
.mini .t b { font-weight: 600; }
.mini .t span { color: var(--muted); display: block; font-size: 12px; }
.due { font-size: 12px; font-weight: 700; white-space: nowrap; }
.due.soon { color: var(--bad); } .due.mid { color: var(--warn); } .due.far { color: var(--muted); }

/* table */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar select, .toolbar input { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.toolbar input { flex: 1 1 200px; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 920px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; background: var(--sunken); }
th button { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
th.r, td.r { text-align: right; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--sunken); }
td a, .link { color: var(--accent); font-weight: 600; text-decoration: none; background: none; border: 0; padding: 0; text-align: left; }
td .sub { color: var(--muted); font-size: 12px; }
td.clip .sub { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 260px; }
tfoot td { font-weight: 700; background: var(--sunken); border-bottom: 0; }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.pill.active, .pill.low { background: var(--ok-soft); color: var(--ok); }
.pill.expiring, .pill.medium { background: var(--warn-soft); color: var(--warn); }
.pill.expired, .pill.high { background: var(--bad-soft); color: var(--bad); }
.pill.upcoming, .pill.renewing { background: var(--info-soft); color: var(--info); }
.pill.unknown, .pill.none { background: var(--sunken); color: var(--muted); }
.pill.example { background: var(--sunken); color: var(--muted); border: 1px dashed var(--line); }
.pill.aip { background: var(--ai-soft); color: var(--ai); }

/* board */
.board { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--sunken); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 120px; }
.col h3 { font-size: 13px; display: flex; justify-content: space-between; padding: 2px 4px 6px; border-bottom: 3px solid var(--line); }
.col h3.s-Active { border-color: var(--ok); } .col h3.s-Expiring { border-color: var(--warn); } .col h3.s-Expired { border-color: var(--bad); } .col h3.s-Upcoming, .col h3.s-Renewing { border-color: var(--info); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 4px; cursor: pointer; box-shadow: var(--shadow); text-align: left; }
.tile:hover { border-color: var(--accent); }
.tile b { font-weight: 700; }
.tile .row { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }

/* record */
.crumb { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
.hl { padding: 16px; display: grid; gap: 14px; }
.hl-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.hl-top h1 { font-size: 22px; font-weight: 800; }
.hl-fields { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.hl-fields > div { display: grid; gap: 2px; min-width: 0; }
.hl-fields .v { font-weight: 700; overflow-wrap: anywhere; }
@media (max-width: 860px) { .hl-fields { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.rec-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 1000px) { .rec-grid { grid-template-columns: 1fr; } }
.subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding-inline: 10px; overflow-x: auto; }
.subtabs button { border: 0; background: none; padding: 11px 12px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.subtabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.dgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 20px; }
@media (max-width: 560px) { .dgrid { grid-template-columns: 1fr; } }
.df { display: grid; gap: 3px; padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.df.wide { grid-column: 1 / -1; }
.df .v { overflow-wrap: anywhere; white-space: pre-wrap; }
.df input, .df textarea, .df select { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 10px; width: 100%; }
.df textarea { min-height: 72px; resize: vertical; }
.kd-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 6px; margin-bottom: 6px; }
.kd-row input { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 8px; min-width: 0; }
.act { list-style: none; margin: 0; padding: 0; }
.act li { padding: 10px 0 10px 18px; border-left: 2px solid var(--line); margin-left: 6px; position: relative; }
.act li::before { content: ""; position: absolute; left: -6px; top: 14px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }
.act li.ai::before { background: var(--ai); }
.act time { display: block; font-size: 12px; color: var(--muted); }
.bullets { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.confirm { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--bad-soft); padding: 6px 10px; border-radius: 8px; }

.empty { padding: 34px 20px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty h3 { color: var(--fg); font-size: 18px; }

/* assistant */
.asst { width: 380px; border-left: 1px solid var(--line); background: var(--surface); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
.asst[hidden] { display: none !important; }
.asst header { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.asst header h2 { font-size: 15px; display: flex; gap: 8px; align-items: center; }
.asst .ctx { font-size: 12px; color: var(--muted); }
.thread { overflow-y: auto; padding: 14px; display: grid; gap: 12px; align-content: start; }
.msg { max-width: 92%; padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; line-height: 1.5; overflow-wrap: anywhere; }
.msg.u { justify-self: end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.msg.a { justify-self: start; background: var(--sunken); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.a.err { border-color: var(--bad); }
.steps { display: flex; flex-wrap: wrap; gap: 4px; justify-self: start; }
.steps .pill { font-weight: 600; }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 5px 10px; font-size: 12px; text-align: left; }
.chip:hover { border-color: var(--ai); color: var(--ai); }
.composer { border-top: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 8px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.composer textarea { width: 100%; min-height: 64px; max-height: 160px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: var(--bg); }
.composer .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
@media (max-width: 1100px) {
  .asst { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); z-index: 30; box-shadow: var(--shadow-lg); padding-top: env(safe-area-inset-top, 0px); }
}

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(8, 14, 28, .45); z-index: 25; }
.modal { position: fixed; z-index: 26; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(620px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow-y: auto; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg); }
.modal header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal header h2 { font-size: 17px; }
.modal .pad { padding: 16px 18px; display: grid; gap: 12px; }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 26px 16px; text-align: center; display: grid; gap: 8px; justify-items: center; color: var(--muted); }
.drop.drag { border-color: var(--ai); background: var(--ai-soft); }
.drop strong { color: var(--fg); font-size: 15px; }
.queue { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.queue li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 10px; background: var(--sunken); border-radius: 8px; }
.queue .fn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.queue .err { grid-column: 1 / -1; color: var(--bad); font-size: 12px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--head); color: var(--head-fg); padding: 10px 16px; border-radius: 10px; z-index: 50; font-weight: 600; max-width: calc(100% - 32px); box-shadow: var(--shadow-lg); }
.foot { color: var(--muted); font-size: 12px; }
@media (prefers-reduced-motion: no-preference) {
  .msg, .card { animation: rise .2s ease-out; }
  @keyframes rise { from { transform: translateY(4px); } }
  .thinking::after { content: "…"; animation: blink 1s steps(3) infinite; }
  @keyframes blink { 50% { opacity: .3; } }
}
</style>

<div class="app">
  <header class="gh">
    <div class="logo"><i aria-hidden="true">CL</i><span>Contract Ledger</span></div>
    <div class="gsearch">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="gq" type="search" placeholder="Search contracts, accounts, terms…" aria-label="Search everything">
    </div>
    <div class="gh-actions">
      <button class="gbtn" id="addBtn"><span aria-hidden="true">+</span><span class="t">Add contracts</span></button>
      <button class="gbtn ai" id="asstBtn" aria-pressed="true"><span aria-hidden="true">✦</span><span class="t">Assistant</span></button>
    </div>
  </header>
  <nav class="nav" aria-label="Main">
    <button data-go="home" aria-current="page">Home</button>
    <button data-go="contracts">Contracts</button>
    <button data-go="accounts">Accounts</button>
    <button data-go="deadlines">Deadlines</button>
  </nav>
  <div class="body">
    <main id="main"><div class="page" id="page"></div></main>
    <aside class="asst" id="asst" aria-label="AI assistant">
      <header>
        <div><h2><span class="ico x" aria-hidden="true">✦</span>Ledger Assistant</h2><div class="ctx" id="asstCtx">Looking at: all contracts</div></div>
        <div style="display:flex;gap:4px"><button class="btn ghost sm" id="newChat">New chat</button><button class="btn ghost sm" id="closeAsst" aria-label="Close assistant">Close</button></div>
      </header>
      <div class="thread" id="thread"></div>
      <div class="composer">
        <div class="sugg" id="sugg"></div>
        <textarea id="prompt" placeholder="Ask anything about your contracts, or ask me to draft something…" aria-label="Message the assistant"></textarea>
        <div class="row"><span class="foot">Answers come from your saved contracts.</span><span><button class="btn sm" id="stopBtn" hidden>Stop</button> <button class="btn primary sm" id="sendBtn">Send</button></span></div>
      </div>
    </aside>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" hidden>
  <header><h2 id="mTitle">Add contracts</h2><button class="btn ghost sm" id="closeModal">Close</button></header>
  <div class="pad">
    <div class="drop" id="drop">
      <strong>Drop contract files here</strong>
      <span>PDF, Word (.docx) or .txt. AI reads each one and creates a record with the organization, industry, earnings, bonuses, key dates and a risk rating.</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn primary" id="chooseBtn">Choose files</button><button class="btn" id="sampleBtn">Load example contracts</button></div>
      <input type="file" id="fileInput" multiple accept=".pdf,.docx,.txt,application/pdf,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
    </div>
    <ul class="queue" id="queue"></ul>
  </div>
</div>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const DAY = 86400000;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const todayISO = iso(today);
  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function parseD(s) { if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
  function fmtD(s) { const d = parseD(s); return d ? d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "—"; }
  function money(n, cur) {
    if (n === null || n === undefined || n === "" || isNaN(Number(n))) return "—";
    try { return new Intl.NumberFormat(undefined, { style: "currency", currency: cur || "USD", maximumFractionDigits: 0 }).format(Number(n)); }
    catch { return "$" + Math.round(Number(n)).toLocaleString(); }
  }
  function compact(n) { n = Number(n) || 0; return n >= 1e6 ? "$" + (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M" : n >= 1e3 ? "$" + Math.round(n / 1e3) + "K" : "$" + Math.round(n); }
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2600); }
  const daysTo = (s) => Math.round((parseD(s) - today) / DAY);

  // ---------- state ----------
  let contracts = [];
  let store = null, sample = null, downloads = null, toolsOK = false, maxPrompt = 262144;
  let route = { name: "home" };
  let listView = "all", listMode = "table", sortKey = "org", sortDir = 1, listQuery = "", accountFilter = "";
  let recTab = "details", editMode = false, kdDraft = [];
  let localSeq = 0;

  // ---------- derived ----------
  const STAGES = ["Upcoming", "Active", "Expiring", "Renewing", "Expired"];
  function status(c) {
    const s = parseD(c.startDate), e = parseD(c.endDate);
    if (s && s > today) return "Upcoming";
    if (e && e < today) return c.autoRenew ? "Renewing" : "Expired";
    if (e && (e - today) / DAY <= 90) return c.autoRenew ? "Renewing" : "Expiring";
    if (s || e) return "Active";
    return "Unknown";
  }
  function deadlinesOf(c) {
    const out = [];
    const e = parseD(c.endDate);
    if (e) {
      const nd = Number(c.renewalNoticeDays);
      if (nd > 0) out.push({ date: iso(new Date(e.getTime() - nd * DAY)), label: c.autoRenew ? `Last day to send non-renewal notice (${nd} days)` : `Last day to give ${nd} days' notice` });
      out.push({ date: c.endDate, label: c.autoRenew ? "Current term ends (auto-renews)" : "Term ends" });
    }
    for (const k of c.keyDates || []) if (parseD(k.date)) out.push({ date: k.date, label: k.label || "Key date" });
    return out.map((d) => ({ ...d, c }));
  }
  const allDeadlines = () => contracts.flatMap(deadlinesOf).sort((a, b) => a.date.localeCompare(b.date));
  const nextDeadline = (c) => deadlinesOf(c).filter((d) => d.date >= todayISO).sort((a, b) => a.date.localeCompare(b.date))[0];
  const riskOf = (c) => (["High", "Medium", "Low"].includes(c.riskLevel) ? c.riskLevel : null);
  const riskPill = (c) => { const r = riskOf(c); return r ? `<span class="pill ${r.toLowerCase()}">${r === "High" ? "▲" : r === "Medium" ? "●" : "▼"} ${r} risk</span>` : `<span class="pill none">Not analyzed</span>`; };
  const statusPill = (c) => { const s = status(c); return `<span class="pill ${s.toLowerCase()}">${s}</span>`; };
  const dueCls = (x) => (x < 0 ? "far" : x <= 30 ? "soon" : x <= 90 ? "mid" : "far");
  const dueTxt = (x) => (x < 0 ? `${-x}d ago` : x === 0 ? "today" : `in ${x}d`);
  const byId = (id) => contracts.find((c) => c.id === id);

  // ---------- routing ----------
  function go(name, id) {
    route = { name, id }; editMode = false;
    if (name === "record") recTab = "details";
    document.querySelectorAll(".nav button").forEach((b) => b.setAttribute("aria-current", b.dataset.go === (name === "record" ? "contracts" : name) ? "page" : "false"));
    render(); $("main").scrollTop = 0; updateAsstContext();
  }
  function render() {
    const p = $("page");
    if (route.name === "record" && !byId(route.id)) route = { name: "contracts" };
    p.innerHTML = ({ home: pageHome, contracts: pageContracts, accounts: pageAccounts, deadlines: pageDeadlines, record: pageRecord })[route.name]();
    if (route.name === "record") renderKd();
  }

  // ---------- pages ----------
  const bannerHtml = () => (state.banner ? `<div class="banner">${esc(state.banner)}</div>` : "");
  const state = { banner: "" };

  function emptyAll(msg) {
    return `<div class="card"><div class="empty"><h3>No contracts yet</h3><p>${msg || "Add contract files and the AI builds your records, or load the example contracts to explore."}</p><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn primary" data-act="add">Add contracts</button><button class="btn" data-act="examples">Load example contracts</button></div></div></div>`;
  }

  function pageHome() {
    const n = contracts.length;
    const yv = contracts.reduce((s, c) => s + (Number(c.annualValue) || 0), 0);
    const bonus = contracts.reduce((s, c) => s + (Number(c.maxBonus) || 0), 0);
    const due = allDeadlines().filter((d) => { const x = daysTo(d.date); return x >= 0 && x <= 90; });
    const high = contracts.filter((c) => riskOf(c) === "High").length;
    const kpis = `<div class="kpis">
      <div class="card kpi"><span class="label">Contracts</span><span class="v">${n}</span><span class="s">${new Set(contracts.map((c) => c.org)).size} accounts</span></div>
      <div class="card kpi"><span class="label">Year-1 earnings</span><span class="v">${compact(yv)}</span><span class="s">${money(yv)} committed</span></div>
      <div class="card kpi"><span class="label">Bonuses at stake</span><span class="v">${compact(bonus)}</span><span class="s">${contracts.filter((c) => Number(c.maxBonus) > 0).length} contract(s) with a bonus</span></div>
      <div class="card kpi"><span class="label">Due in 90 days</span><span class="v">${due.length}</span><span class="s">${high ? high + " high-risk contract(s)" : due.length ? "next " + fmtD(due[0].date) : "nothing due"}</span></div>
    </div>`;
    if (!n) return bannerHtml() + `<div class="page-head"><h1>Good ${greet()}</h1></div>` + kpis + emptyAll();

    // pipeline
    const counts = Object.fromEntries(STAGES.map((s) => [s, contracts.filter((c) => status(c) === s).length]));
    const path = `<div class="path">${STAGES.map((s) => `<button class="st${counts[s] ? " done" : ""}" data-stage="${s}">${s}<span class="n">${counts[s]}</span></button>`).join("")}</div>`;

    // chart: year-1 earnings by industry
    const byInd = {};
    for (const c of contracts) { const k = c.industry || "Unspecified"; (byInd[k] ||= { v: 0, n: 0 }); byInd[k].v += Number(c.annualValue) || 0; byInd[k].n++; }
    const rows = Object.entries(byInd).sort((a, b) => b[1].v - a[1].v).slice(0, 8);
    const max = Math.max(1, ...rows.map((r) => r[1].v));
    const chart = `<div class="bars" id="chart">${rows.map(([k, r]) => `<div class="bar-row" data-tip="${esc(k)}|${money(r.v)}|${r.n} contract${r.n > 1 ? "s" : ""}"><span class="nm" title="${esc(k)}">${esc(k)}</span><span class="bar-track"><span class="bar" style="width:${Math.max(1, (r.v / max) * 82)}%"></span><span class="val">${compact(r.v)}</span></span></div>`).join("")}</div>`;

    const upcoming = allDeadlines().filter((d) => d.date >= todayISO).slice(0, 6);
    const dl = upcoming.length ? `<ul class="mini">${upcoming.map((d) => { const x = daysTo(d.date); return `<li data-open="${esc(d.c.id)}" tabindex="0"><span class="num">${fmtD(d.date)}</span><span class="t"><b>${esc(d.c.org)}</b><span>${esc(d.label)}</span></span><span class="due ${dueCls(x)}">${dueTxt(x)}</span></li>`; }).join("")}</ul>` : `<div class="empty"><p>No upcoming deadlines.</p></div>`;

    const recent = [...contracts].sort((a, b) => String(b.addedAt || "").localeCompare(String(a.addedAt || ""))).slice(0, 5);
    const rec = `<ul class="mini">${recent.map((c) => `<li data-open="${esc(c.id)}" tabindex="0"><span>${statusPill(c)}</span><span class="t"><b>${esc(c.org)}</b><span>${esc(c.industry || "")}</span></span><span>${riskPill(c)}</span></li>`).join("")}</ul>`;

    return bannerHtml() + `<div class="page-head"><h1>Good ${greet()}</h1><span class="muted">${today.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" })}</span></div>
      ${kpis}
      <div class="grid-home">
        <div class="stack">
          <section class="card ai-card"><header><h2><span class="ico x" aria-hidden="true">✦</span>AI briefing</h2><button class="btn ai sm" data-act="briefing" ${sample ? "" : "disabled"}>${state.briefing ? "Refresh" : "Generate briefing"}</button></header>
            <div class="pad ai-out ${state.briefing ? "" : "dim"}" id="briefing">${esc(state.briefing || "Get a short AI summary of what needs your attention: upcoming deadlines, contracts at risk, renewals and bonus opportunities.")}</div></section>
          <section class="card"><header><h2>Renewal pipeline</h2><span class="foot">Click a stage to see its contracts</span></header><div class="pad">${path}</div></section>
          <section class="card"><header><h2>Year-1 earnings by industry</h2><span class="foot">Committed fees, first 12 months</span></header><div class="pad">${chart}</div></section>
        </div>
        <div class="stack">
          <section class="card"><header><h2><span class="ico d" aria-hidden="true">D</span>Upcoming deadlines</h2><button class="link" data-go="deadlines">View all</button></header>${dl}</section>
          <section class="card"><header><h2><span class="ico c" aria-hidden="true">C</span>Recently added</h2><button class="link" data-go="contracts">View all</button></header>${rec}</section>
        </div>
      </div>`;
  }
  function greet() { const h = new Date().getHours(); return h < 12 ? "morning" : h < 18 ? "afternoon" : "evening"; }

  const VIEWS = { all: "All contracts", soon: "Deadlines in 90 days", bonus: "With bonuses", risk: "High risk", renew: "Auto-renewing" };
  function filtered() {
    const q = (listQuery || "").toLowerCase();
    return contracts.filter((c) => {
      if (accountFilter && c.org !== accountFilter) return false;
      if (listView === "soon" && !deadlinesOf(c).some((d) => { const x = daysTo(d.date); return x >= 0 && x <= 90; })) return false;
      if (listView === "bonus" && !(Number(c.maxBonus) > 0)) return false;
      if (listView === "risk" && riskOf(c) !== "High") return false;
      if (listView === "renew" && !c.autoRenew) return false;
      if (STAGES.includes(listView) && status(c) !== listView) return false;
      if (q && ![c.org, c.counterparty, c.industry, c.contractType, c.earnings, c.bonuses, c.summary, c.fileName, c.risks].join(" ").toLowerCase().includes(q)) return false;
      return true;
    });
  }
  function pageContracts() {
    if (!contracts.length) return bannerHtml() + `<div class="page-head"><h1><span class="ico c">C</span>Contracts</h1></div>` + emptyAll();
    const rows = filtered();
    const key = { org: (c) => (c.org || "").toLowerCase(), industry: (c) => (c.industry || "").toLowerCase(), status, risk: (c) => ({ High: 0, Medium: 1, Low: 2 }[riskOf(c)] ?? 3),
      value: (c) => Number(c.annualValue) || 0, bonus: (c) => Number(c.maxBonus) || 0, next: (c) => nextDeadline(c)?.date || "9999" }[sortKey];
    rows.sort((a, b) => (key(a) > key(b) ? 1 : key(a) < key(b) ? -1 : 0) * sortDir);
    const opts = Object.entries(VIEWS).map(([k, v]) => `<option value="${k}"${k === listView ? " selected" : ""}>${v}</option>`).join("") + STAGES.map((s) => `<option value="${s}"${s === listView ? " selected" : ""}>Status: ${s}</option>`).join("");
    const th = (k, l, cls = "") => `<th class="${cls}" aria-sort="${sortKey === k ? (sortDir > 0 ? "ascending" : "descending") : "none"}"><button data-sort="${k}">${l}${sortKey === k ? (sortDir > 0 ? " ↑" : " ↓") : ""}</button></th>`;
    let body;
    if (!rows.length) body = `<div class="empty"><h3>No matches</h3><p>No contract matches this view.</p></div>`;
    else if (listMode === "board") {
      body = `<div class="pad"><div class="board">${STAGES.map((s) => { const cs = rows.filter((c) => status(c) === s); return `<div class="col"><h3 class="s-${s}"><span>${s}</span><span class="num">${cs.length}</span></h3>${cs.map((c) => `<button class="tile" data-open="${esc(c.id)}"><b>${esc(c.org)}</b><span class="row"><span>${esc(c.industry || "")}</span></span><span class="row"><span class="num">${compact(c.annualValue)}/yr 1</span>${riskPill(c)}</span>${nextDeadline(c) ? `<span class="row"><span>Next: ${fmtD(nextDeadline(c).date)}</span></span>` : ""}</button>`).join("")}</div>`; }).join("")}</div></div>`;
    } else {
      const tv = rows.reduce((s, c) => s + (Number(c.annualValue) || 0), 0), tb = rows.reduce((s, c) => s + (Number(c.maxBonus) || 0), 0);
      body = `<div class="tbl-wrap"><table><thead><tr>${th("org", "Org name")}${th("industry", "Industry")}${th("status", "Status")}${th("risk", "AI risk")}<th>Earnings</th>${th("value", "Year-1 earnings", "r")}<th>Bonuses</th>${th("bonus", "Max bonus", "r")}${th("next", "Next deadline")}</tr></thead><tbody>${rows.map((c) => { const nd = nextDeadline(c); return `<tr data-open="${esc(c.id)}" tabindex="0">
        <td><a href="#" data-open="${esc(c.id)}">${esc(c.org || "Untitled")}</a><div class="sub">${esc(c.contractType || "")}${c.example ? ' <span class="pill example">Example</span>' : ""}</div></td>
        <td>${esc(c.industry || "—")}</td><td>${statusPill(c)}</td><td>${riskPill(c)}</td>
        <td class="clip"><div class="sub">${esc(c.earnings || "—")}</div></td><td class="r num">${money(c.annualValue, c.currency)}</td>
        <td class="clip"><div class="sub">${esc(c.bonuses || "—")}</div></td><td class="r num">${money(c.maxBonus, c.currency)}</td>
        <td>${nd ? `<span class="num">${fmtD(nd.date)}</span><div class="sub">${esc(nd.label)}</div>` : '<span class="sub">—</span>'}</td></tr>`; }).join("")}</tbody>
        <tfoot><tr><td colspan="5">${rows.length} contract${rows.length > 1 ? "s" : ""}</td><td class="r num">${money(tv)}</td><td></td><td class="r num">${money(tb)}</td><td></td></tr></tfoot></table></div>`;
    }
    return bannerHtml() + `<div class="page-head"><h1><span class="ico c">C</span>Contracts</h1><div style="display:flex;gap:8px;flex-wrap:wrap">${downloads ? '<button class="btn" data-act="export">Export CSV</button>' : ""}<button class="btn primary" data-act="add">Add contracts</button></div></div>
      <section class="card"><header><div class="toolbar" style="flex:1"><select id="lv" aria-label="List view">${opts}</select><input type="search" id="lq" placeholder="Search this list…" value="${esc(listQuery)}" aria-label="Search this list">${accountFilter ? `<span class="pill aip">Account: ${esc(accountFilter)} <button class="btn ghost sm" data-act="clearAcct" aria-label="Clear account filter" style="padding:0 2px">×</button></span>` : ""}</div>
        <div class="seg" role="group" aria-label="Layout"><button data-mode="table" aria-pressed="${listMode === "table"}">Table</button><button data-mode="board" aria-pressed="${listMode === "board"}">Board</button></div></header>${body}</section>`;
  }

  function pageAccounts() {
    if (!contracts.length) return bannerHtml() + `<div class="page-head"><h1><span class="ico a">A</span>Accounts</h1></div>` + emptyAll();
    const acc = {};
    for (const c of contracts) { const a = (acc[c.org || "Untitled"] ||= { org: c.org || "Untitled", industry: c.industry, list: [] }); a.list.push(c); }
    const rows = Object.values(acc).map((a) => ({ ...a, v: a.list.reduce((s, c) => s + (Number(c.annualValue) || 0), 0), t: a.list.reduce((s, c) => s + (Number(c.totalValue) || 0), 0), b: a.list.reduce((s, c) => s + (Number(c.maxBonus) || 0), 0), nd: a.list.map(nextDeadline).filter(Boolean).sort((x, y) => x.date.localeCompare(y.date))[0], hi: a.list.some((c) => riskOf(c) === "High") })).sort((a, b) => b.v - a.v);
    return bannerHtml() + `<div class="page-head"><h1><span class="ico a">A</span>Accounts</h1><span class="muted">${rows.length} organizations</span></div>
      <section class="card"><div class="tbl-wrap"><table><thead><tr><th>Account</th><th>Industry</th><th class="r">Contracts</th><th class="r">Year-1 earnings</th><th class="r">Initial-term earnings</th><th class="r">Max bonus</th><th>Next deadline</th></tr></thead><tbody>
      ${rows.map((a) => `<tr data-acct="${esc(a.org)}" tabindex="0"><td><a href="#" data-acct="${esc(a.org)}">${esc(a.org)}</a>${a.hi ? ' <span class="pill high">▲ High risk</span>' : ""}</td><td>${esc(a.industry || "—")}</td><td class="r num">${a.list.length}</td><td class="r num">${money(a.v)}</td><td class="r num">${money(a.t)}</td><td class="r num">${money(a.b)}</td><td>${a.nd ? `<span class="num">${fmtD(a.nd.date)}</span><div class="sub">${esc(a.nd.label)}</div>` : "—"}</td></tr>`).join("")}
      </tbody></table></div></section>`;
  }

  function pageDeadlines() {
    const list = allDeadlines().filter((d) => daysTo(d.date) >= -30);
    const body = list.length ? `<ul class="mini">${list.map((d) => { const x = daysTo(d.date); return `<li data-open="${esc(d.c.id)}" tabindex="0" style="${x < 0 ? "opacity:.55" : ""}"><span class="num">${fmtD(d.date)}</span><span class="t"><b>${esc(d.c.org)}</b><span>${esc(d.label)}</span></span><span class="due ${dueCls(x)}">${dueTxt(x)}</span></li>`; }).join("")}</ul>` : `<div class="empty"><h3>No deadlines</h3><p>Notice dates, term ends and key dates from your contracts appear here.</p></div>`;
    return bannerHtml() + `<div class="page-head"><h1><span class="ico d">D</span>Deadlines</h1><span class="muted">Red: within 30 days · Amber: within 90 days</span></div><section class="card">${body}</section>`;
  }

  function pageRecord() {
    const c = byId(route.id), st = status(c), si = STAGES.indexOf(st);
    const path = `<div class="path">${STAGES.map((s, i) => `<div class="st${i === si ? " cur" : i < si ? " done" : ""}">${s}</div>`).join("")}</div>`;
    const field = (k, label, opt = {}) => {
      const v = c[k];
      if (editMode) {
        if (opt.type === "bool") return `<label class="df${opt.wide ? " wide" : ""}"><span class="label">${label}</span><select id="f_${k}"><option value="true"${v ? " selected" : ""}>Yes</option><option value="false"${v ? "" : " selected"}>No</option></select></label>`;
        if (opt.type === "text") return `<label class="df wide"><span class="label">${label}</span><textarea id="f_${k}">${esc(v || "")}</textarea></label>`;
        return `<label class="df${opt.wide ? " wide" : ""}"><span class="label">${label}</span><input id="f_${k}" type="${opt.type || "text"}" value="${esc(v ?? "")}"></label>`;
      }

  async function readText(file) {
    const name = file.name.toLowerCase();
    if (name.endsWith(".txt") || file.type === "text/plain") return await file.text();
    if (name.endsWith(".pdf") || file.type === "application/pdf") {
      if (!window.pdfjsLib) throw new Error("The PDF reader didn't load. Reload the page and try again.");
      const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
      const parts = [];
      for (let p = 1; p <= pdf.numPages; p++) { const tc = await (await pdf.getPage(p)).getTextContent(); parts.push(tc.items.map((it) => it.str + (it.hasEOL ? "\n" : " ")).join("")); }
      return parts.join("\n\n");
    }
    if (name.endsWith(".docx")) {
      if (!window.mammoth) throw new Error("The Word reader didn't load. Reload the page and try again.");
      return (await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value;
    }
    throw new Error("Unsupported file type. Use PDF, Word (.docx) or .txt.");
  }

- "termMonths": number or null. "autoRenew": true or false.

- "currency": ISO code, e.g. "USD".
- "earnings": 1-3 plain sentences summarizing all fees, pay or compensation, with amounts and timing.
- "annualValue": number or null. Committed money in the first 12 months (one-time + recurring). Exclude usage-based extras and bonuses.

      try {

        if (text.length < 40) throw new Error("No readable text found. Scanned PDFs (pictures of pages) can't be read yet.");
        let truncated = false;

    { org: "Lakeshore Private Hospital", counterparty: "MediLink Systems, Inc.", industry: "Healthcare - Hospital", contractType: "SaaS subscription", startDate: "2025-01-01", endDate: "2027-12-31", termMonths: 36, autoRenew: true, renewalNoticeDays: 120, currency: "USD",
      earnings: "Implementation fee $240,000 (30/40/30). Subscription $480,000/yr billed quarterly, rising 5% each year. $90/bed/month above 250 beds; optional Telehealth $6,000/month.", annualValue: 720000, totalValue: 1753200,
      bonuses: "None", maxBonus: 0, keyDates: [{ date: "2026-12-31", label: "Client may terminate for convenience after this date (180 days' notice, fee up to $250,000)" }],
      risks: "Early termination fee capped at $250,000; 120-day non-renewal notice.", summary: "36-month patient management platform subscription for a 220-bed hospital.", riskLevel: "Medium",
      insights: { reasons: ["Largest account: $1.75M over the term", "Client can exit for convenience from Jan 2027, with a fee capped at $250,000", "Service credits up to 20% if availability drops"], actions: ["Schedule a value review before Dec 31, 2026", "Track uptime monthly to avoid service credits", "Start the renewal conversation by Sep 2027"], at: EX_AT },
      fileName: "Contract_1_-_Lakeshore_Private_Hospital.pdf" },
    { org: "Brightsight Eye Clinic, P.A.", counterparty: "MediLink Systems, Inc.", industry: "Healthcare - Ophthalmology", contractType: "SaaS subscription", startDate: "2026-03-01", endDate: "2027-02-28", termMonths: 12, autoRenew: true, renewalNoticeDays: 60, currency: "USD",
      earnings: "Onboarding $9,500. $495 per provider/month (6 providers = $2,970/month). Imaging add-on $1,200/month from Sep 1, 2026 at the latest. SMS over 3,000/month at $0.04.", annualValue: 52340, totalValue: 52340,
      bonuses: "None. On renewal the client gets one month's subscription as a loyalty credit.", maxBonus: 0, keyDates: [{ date: "2026-09-01", label: "Imaging add-on fee starts (latest date)" }, { date: "2026-11-30", label: "Last day to give notice of a renewal price increase" }],
      risks: "Short 12-month term; client can exit for three months of fees.", summary: "12-month scheduling and imaging platform subscription for an eye clinic.", riskLevel: "High",
      insights: { reasons: ["Term ends Feb 28, 2027; client can cancel with 60 days' notice", "Price increase notice must go out by Nov 30, 2026", "Renewal gives away one month free"], actions: ["Send renewal price-increase notice before Nov 30, 2026", "Confirm imaging add-on is live and billed", "Book a renewal call in November"], at: EX_AT },
      fileName: "Contract_2_-_Brightsight_Eye_Clinic.pdf" },
    { org: "Maple Street Family Medicine, LLC", counterparty: "MediLink Systems, Inc.", industry: "Healthcare - Primary care", contractType: "SaaS subscription", startDate: "2026-06-01", endDate: "2028-05-31", termMonths: 24, autoRenew: true, renewalNoticeDays: 90, currency: "USD",
      earnings: "Implementation $6,000 (50/50). $425 per provider/month for 4 providers, +3% each June from 2027. Amendment 1 adds a 5th provider at $375/month from Dec 1, 2026.", annualValue: 28650, totalValue: 54297,
      bonuses: "Adoption Incentive Fee: $8,000 if 60% to under 75% of patients activate the portal; $12,000 if 75% or more. Measured Mar 15, 2027.", maxBonus: 12000,
      keyDates: [{ date: "2027-03-15", label: "Portal adoption measured (bonus date)" }, { date: "2027-03-30", label: "Bonus invoiced by this date" }, { date: "2027-06-01", label: "3% price increase; client may terminate for convenience from now" }],
      risks: "Bonus depends on patient portal adoption; client can leave without a fee after June 2027.", summary: "24-month patient portal subscription with an adoption bonus, amended Nov 2026.", riskLevel: "Low",
      insights: { reasons: ["Up to $12,000 bonus available", "No early exit in the first 12 months", "Small account value"], actions: ["Push portal sign-ups before Mar 15, 2027 to reach 75%", "Invoice the bonus by Mar 30, 2027", "Apply the 3% increase on Jun 1, 2027"], at: EX_AT },
      fileName: "Contract_3_-_Maple_Street_Family_Medicine_with_Amendment.pdf" },
    { org: "NorthPoint Urgent Care Center, LLC", counterparty: "MediLink Systems, Inc.", industry: "Healthcare - Urgent care", contractType: "Services agreement", startDate: "2026-10-01", endDate: "2027-09-30", termMonths: 12, autoRenew: false, renewalNoticeDays: 30, currency: "USD",
      earnings: "Implementation $4,500 (50/50). Platform $3,500/month from Dec 1, 2026 (Oct-Nov waived). Visits over 1,500/month at $1.80, over 3,000 at $1.20. Minimum $4,200/month.", annualValue: 46500, totalValue: 46500,
      bonuses: "None", maxBonus: 0, keyDates: [{ date: "2026-11-01", label: "Target go-live; second implementation payment due" }, { date: "2026-12-01", label: "Platform fee and $4,200 monthly minimum begin" }],
      risks: "Becomes month-to-month after the first year; client can leave on 30 days' notice.", summary: "12-month online check-in and queue platform for an urgent care center.", riskLevel: "Medium",
      insights: { reasons: ["No auto-renewal: goes month-to-month after Sep 2027", "Go-live on Nov 1, 2026 triggers a $2,250 payment", "Visit fees add upside above 1,500 visits/month"], actions: ["Hit the Nov 1, 2026 go-live date", "Invoice the first platform fee on Dec 1, 2026", "Propose a multi-year renewal by Jul 2027"], at: EX_AT },
      fileName: "Contract_4_-_NorthPoint_Urgent_Care_Center.pdf" },
  ];
  async function toggleExamples() {
    const ex = contracts.filter((c) => c.example);
    try {
      if (ex.length) { for (const c of ex) await removeContract(c.id); toast("Examples removed"); }
      else { for (const e of EXAMPLES) await addContract({ ...e, example: true, addedAt: new Date().toISOString(), activity: [{ at: new Date().toISOString(), text: "Example record loaded", ai: false }] }); toast("Example contracts added"); closeModal(); }
    } catch (e) { toast("Couldn't update examples: " + (e?.message || e?.code || "try again")); }
  }

  // ---------- export ----------
  async function exportCsv() {
    const cols = [["org", "Org Name"], ["industry", "Industry"], ["counterparty", "Other Party"], ["contractType", "Type"], ["status", "Status"], ["riskLevel", "AI Risk"], ["startDate", "Start"], ["endDate", "Term End"], ["autoRenew", "Auto-renew"], ["renewalNoticeDays", "Notice Days"], ["earnings", "Earnings"], ["annualValue", "Year-1 Earnings"], ["totalValue", "Initial-Term Earnings"], ["bonuses", "Bonuses"], ["maxBonus", "Max Bonus"], ["next", "Next Deadline"], ["fileName", "File"]];
    const cell = (v) => { const s = v === null || v === undefined ? "" : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const lines = [cols.map((c) => c[1]).join(",")].concat(filtered().map((c) => cols.map(([k]) => k === "status" ? cell(status(c)) : k === "next" ? cell((nextDeadline(c) || {}).date ? nextDeadline(c).date + " " + nextDeadline(c).label : "") : cell(c[k])).join(",")));
    try { await downloads.save({ filename: "contracts-" + todayISO + ".csv", data: new Blob(["﻿" + lines.join("\n")], { type: "text/csv" }) }); }
    catch (e) { if (!["cancelled", "declined"].includes(e?.code)) toast("Export didn't finish."); }
  }

  // ---------- modal ----------
  function openModal() { $("modal").hidden = false; $("scrim").hidden = false; $("chooseBtn").focus(); $("sampleBtn").textContent = contracts.some((c) => c.example) ? "Remove examples" : "Load example contracts"; }
  function closeModal() { $("modal").hidden = true; $("scrim").hidden = true; }

  // ---------- events ----------
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-go],[data-open],[data-acct],[data-act],[data-sort],[data-mode],[data-stage],[data-rtab],[data-ask],[data-rm]");
    if (!t) return;
    if (t.tagName === "A") e.preventDefault();
    if (t.dataset.go) return go(t.dataset.go);
    if (t.dataset.open) { closeModal(); return go("record", t.dataset.open); }
    if (t.dataset.acct) { accountFilter = t.dataset.acct; listView = "all"; return go("contracts"); }
    if (t.dataset.sort) { const k = t.dataset.sort; sortDir = sortKey === k ? -sortDir : 1; sortKey = k; return render(); }
    if (t.dataset.mode) { listMode = t.dataset.mode; return render(); }
    if (t.dataset.stage) { listView = t.dataset.stage; accountFilter = ""; return go("contracts"); }
    if (t.dataset.rtab) { recTab = t.dataset.rtab; return render(); }
    if (t.dataset.ask) { openAsst(true); return send(t.dataset.ask); }
    if (t.dataset.rm !== undefined) { kdDraft.splice(Number(t.dataset.rm), 1); return renderKd(); }
    const c = route.name === "record" ? byId(route.id) : null;
    switch (t.dataset.act) {
      case "add": return openModal();
      case "examples": return toggleExamples();
      case "export": return exportCsv();
      case "briefing": return briefing();
      case "clearAcct": accountFilter = ""; return render();
      case "analyze": return c && analyze(c);
      case "edit": editMode = true; recTab = "details"; kdDraft = (c.keyDates || []).map((k) => ({ ...k })); return render();
      case "cancelEdit": editMode = false; return render();
      case "kdAdd": kdDraft.push({ date: "", label: "" }); return renderKd();
      case "saveEdit": return saveEdit(c);
      case "del": $("delZone").innerHTML = `<span class="confirm">Delete this contract? <button class="btn danger sm" data-act="delYes">Delete</button><button class="btn sm" data-act="delNo">Keep</button></span>`; return;
      case "delNo": return render();
      case "delYes": { const id = c.id; go("contracts"); removeContract(id).then(() => toast("Deleted"), () => toast("Couldn't delete. Try again.")); return; }
    }
  });
  async function saveEdit(c) {
    const patch = {};
    const F = [["org"], ["counterparty"], ["industry"], ["contractType"], ["startDate"], ["endDate"], ["autoRenew", "bool"], ["renewalNoticeDays", "n"], ["annualValue", "n"], ["totalValue", "n"], ["maxBonus", "n"], ["currency"], ["earnings"], ["bonuses"], ["risks"]];
    for (const [k, ty] of F) { const el = $("f_" + k); if (!el) continue; const raw = el.value.trim(); patch[k] = ty === "n" ? (raw === "" ? null : Number(raw)) : ty === "bool" ? raw === "true" : raw || null; }
    patch.keyDates = kdDraft.filter((k) => parseD(k.date)).map((k) => ({ date: k.date, label: (k.label || "").trim() || "Key date" }));
    try { await saveContract(c.id, { ...stripId(c), ...patch, activity: withAct(c, "Details edited") }); editMode = false; render(); toast("Saved"); }
    catch (e) { toast("Couldn't save: " + (e?.message || e?.code || "try again")); }
  }
  document.addEventListener("input", (e) => {
    const i = e.target.dataset?.i; if (i !== undefined) { kdDraft[Number(i)][e.target.dataset.k] = e.target.value; return; }
    if (e.target.id === "lq") { listQuery = e.target.value; const pos = e.target.selectionStart; render(); const el = $("lq"); el.focus(); el.setSelectionRange(pos, pos); }
    if (e.target.id === "lv") { listView = e.target.value; render(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { if (!$("modal").hidden) closeModal(); }
    if (e.key === "Enter" && e.target.matches("[data-open],[data-acct]") && e.target.tagName !== "BUTTON" && e.target.tagName !== "A") e.target.click();
  });
  $("gq").addEventListener("keydown", (e) => { if (e.key === "Enter") { listQuery = e.target.value; listView = "all"; accountFilter = ""; go("contracts"); } });
  $("addBtn").addEventListener("click", openModal);
  $("closeModal").addEventListener("click", closeModal);
  $("scrim").addEventListener("click", closeModal);
  $("chooseBtn").addEventListener("click", () => $("fileInput").click());
  $("sampleBtn").addEventListener("click", toggleExamples);
  $("fileInput").addEventListener("change", (e) => { processFiles([...e.target.files]); e.target.value = ""; });
  const drop = $("drop");
  ["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("drag"); }));
  ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("drag"); }));
  drop.addEventListener("drop", (e) => processFiles([...(e.dataTransfer?.files || [])]));
  $("asstBtn").addEventListener("click", () => openAsst($("asst").hidden));
  $("closeAsst").addEventListener("click", () => openAsst(false));
  $("newChat").addEventListener("click", () => { asstCtl?.abort(); turns = []; renderThread(); updateAsstContext(); });
  $("sendBtn").addEventListener("click", () => send($("prompt").value));
  $("stopBtn").addEventListener("click", () => asstCtl?.abort());
  $("prompt").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("prompt").value); } });
  // chart tooltip
  document.addEventListener("mousemove", (e) => {
    const r = e.target.closest?.(".bar-row"); const tip = $("tip");
    if (!r) { tip.hidden = true; return; }
    const [k, v, n] = r.dataset.tip.split("|");
    tip.innerHTML = `<b>${esc(k)}</b>${esc(v)} year-1 · ${esc(n)}`; tip.hidden = false;
    tip.style.left = Math.min(e.clientX + 14, innerWidth - 250) + "px"; tip.style.top = e.clientY + 14 + "px";
  });

  // ---------- boot ----------
  if (innerWidth < 1100) openAsst(false);
  render(); renderThread(); updateAsstContext();
  (async () => {
    const use = window.claude?.use;
    if (!use) { state.banner = "Open this page on claude.ai to save contracts and use the AI features. Changes here aren't saved."; render(); return; }
    const [db, user, smp, dl] = await Promise.all(["db", "user", "sample", "downloads"].map((n) => use(n).catch(() => null)));
    sample = smp; downloads = dl;
    if (sample) { const lim = await sample.limits().catch(() => null); if (lim) { maxPrompt = lim.maxPromptBytes || maxPrompt; toolsOK = !!lim.tools; } }
    else state.banner = "AI features aren't available in this view. You can still view and edit saved contracts.";
    const uid = user ? await user.id().catch(() => null) : null;
    if (db && uid) {
      store = db.doc("data/users/" + uid + "/ledger").collection("contracts");
      store.onSnapshot((snap) => {
        contracts = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        const active = document.activeElement;
        if (!(editMode && route.name === "record") && !(active && ["lq", "prompt"].includes(active.id))) render();
        updateAsstContext();
      }, (e) => { state.banner = "Your saved contracts couldn't be loaded (" + (e?.code || "error") + "). Reload the page to try again."; render(); });
    } else if (!state.banner) state.banner = "Sign in to claude.ai to save your contracts. Until then, anything you add disappears when you close the page.";
    render(); updateAsstContext();
  })();
})();
</script>
