<title>Promisely</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* Layout: one calm column (max ~1120px) under a single slim header. Each page answers one question; details open in a side drawer. Blue = what we owe, green = what they owe us. */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --sunken: #f1f3f6;
  --hover: #f6f8fb;
  --fg: #1b2230;
  --muted: #667085;
  --faint: #98a2b3;
  --line: #e6e8ec;
  --line-strong: #d0d5dd;
  --brand: #1f5fd1;
  --brand-ink: #ffffff;
  --brand-soft: #edf3fe;
  --we: #1f5fd1; --we-soft: #edf3fe;
  --they: #137a52; --they-soft: #e8f6ef;
  --red: #c4320a; --red-soft: #fdeee9;
  --amber: #b54708; --amber-soft: #fef4e6;
  --green: #137a52; --green-soft: #e8f6ef;
  --ai: #6d3fd6; --ai-soft: #f3eefd;
  --series-1: #2a78d6;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05);
  --shadow-lg: 0 12px 32px rgba(16, 24, 40, .18);
  --f: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --surface: #171b21; --sunken: #1d222a; --hover: #1f252e; --fg: #e8ebf0; --muted: #a0a8b6; --faint: #6c7584; --line: #272d36; --line-strong: #39414d;
    --brand: #6ea2ff; --brand-ink: #0b1424; --brand-soft: #18243a; --we: #6ea2ff; --we-soft: #18243a; --they: #4fc79a; --they-soft: #12291f;
    --red: #ff8a6b; --red-soft: #3a1d15; --amber: #f6b25e; --amber-soft: #352510; --green: #4fc79a; --green-soft: #12291f; --ai: #b69bff; --ai-soft: #261f3d; --series-1: #3987e5;
    --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 12px 32px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --surface: #171b21; --sunken: #1d222a; --hover: #1f252e; --fg: #e8ebf0; --muted: #a0a8b6; --faint: #6c7584; --line: #272d36; --line-strong: #39414d;
  --brand: #6ea2ff; --brand-ink: #0b1424; --brand-soft: #18243a; --we: #6ea2ff; --we-soft: #18243a; --they: #4fc79a; --they-soft: #12291f;
  --red: #ff8a6b; --red-soft: #3a1d15; --amber: #f6b25e; --amber-soft: #352510; --green: #4fc79a; --green-soft: #12291f; --ai: #b69bff; --ai-soft: #261f3d; --series-1: #3987e5;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 12px 32px rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f); font-size: 14.5px; line-height: 1.5; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topin { max-width: 1180px; margin: 0 auto; padding-inline: 20px; height: 60px; display: flex; align-items: center; gap: 22px; }
.logo { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; white-space: nowrap; }
.nav { display: flex; gap: 2px; height: 100%; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.nav button { border: 0; background: none; padding: 0 12px; height: 100%; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; }
.nav button:hover { color: var(--fg); }
.nav button[aria-current="page"] { color: var(--fg); border-bottom-color: var(--brand); }
.tright { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.search { position: relative; }
.search input { width: 220px; border: 1px solid var(--line); background: var(--sunken); border-radius: 10px; padding: 7px 10px 7px 32px; }
.search input:focus { background: var(--surface); border-color: var(--brand); outline: none; width: 280px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 0; background: none; display: grid; place-items: center; color: var(--muted); position: relative; }
.icon-btn:hover { background: var(--sunken); color: var(--fg); }
.icon-btn .badge { position: absolute; top: 3px; right: 2px; background: var(--red); color: #fff; font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; display: grid; place-items: center; padding: 0 4px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--brand-soft); color: var(--brand); font-weight: 700; font-size: 13px; display: grid; place-items: center; }
@media (max-width: 900px) { .search { display: none; } .topin { gap: 12px; } .nav button { padding: 0 8px; } }
@media (max-width: 620px) { .logo span, .hide-sm { display: none; } .nav button { font-size: 13px; padding: 0 6px; } .topin { padding-inline: 12px; gap: 8px; } .tright { gap: 2px; } #bellBtn { display: none; } }

main { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 80px; }
.page { display: grid; gap: 20px; }
.disclaimer { text-align: center; color: var(--faint); font-size: 12px; margin-top: 32px; }

/* basic pieces */
.btn { border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); padding: 8px 14px; border-radius: 10px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--sunken); color: var(--fg); }
.btn.ai { color: var(--ai); }
.btn.danger { color: var(--red); }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link { border: 0; background: none; padding: 0; color: var(--brand); font-weight: 500; text-align: left; }
.link:hover { text-decoration: underline; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px 0; flex-wrap: wrap; }
.card-h h2 { font-size: 16px; }
.card-b { padding: 14px 20px 18px; }
.ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.ph h1 { font-size: 26px; letter-spacing: -.01em; }
.ph p { margin: 4px 0 0; color: var(--muted); }
.ph .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.crumb { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
.banner { padding: 10px 14px; border-radius: 10px; background: var(--amber-soft); color: var(--amber); font-size: 13.5px; }
.preview-banner { padding: 10px 14px; border-radius: 10px; background: var(--ai-soft); color: var(--ai); font-size: 13.5px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.empty { text-align: center; padding: 48px 20px; display: grid; gap: 10px; justify-items: center; color: var(--muted); }
.empty h3 { color: var(--fg); font-size: 18px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 6px; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--faint); flex: none; }
.dot.green { background: var(--green); } .dot.amber { background: var(--amber); } .dot.red { background: var(--red); } .dot.blue { background: var(--brand); }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
.warn { color: var(--amber); } .bad { color: var(--red); } .good { color: var(--green); }
.seg { display: inline-flex; background: var(--sunken); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 8px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.seg button .n { color: var(--faint); margin-left: 4px; font-variant-numeric: tabular-nums; }
.seg.big button { padding: 9px 18px; font-size: 15px; }
.seg.big button[aria-pressed="true"].we { color: var(--we); } .seg.big button[aria-pressed="true"].they { color: var(--they); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 5px 12px; font-size: 13px; color: var(--muted); }
.chip:hover { border-color: var(--line-strong); color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--surface); }
.input, .toolbar input, .toolbar select { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 10px; padding: 7px 10px; min-width: 0; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar .grow { flex: 1 1 200px; }

/* home */
.hello h1 { font-size: 28px; letter-spacing: -.01em; }
.hello p { margin: 4px 0 0; color: var(--muted); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 820px) { .two { grid-template-columns: 1fr; } }
.side-card { padding: 22px 22px 14px; display: grid; gap: 14px; align-content: start; border-top: 4px solid var(--we); }
.side-card.they { border-top-color: var(--they); }
.side-card .lbl { font-size: 13px; font-weight: 600; color: var(--we); text-transform: uppercase; letter-spacing: .06em; }
.side-card.they .lbl { color: var(--they); }
.side-card .bigamt { font-size: 34px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.side-card .sub { color: var(--muted); font-size: 13.5px; }
.side-card .foot { border-top: 1px solid var(--line); padding-top: 10px; }

/* rows (obligations and generic lists) */
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 11px 8px; border-radius: 10px; cursor: pointer; }
.row + .row { border-top: 1px solid var(--line); }
.row:hover { background: var(--hover); }
.row.compact { grid-template-columns: 44px minmax(0, 1fr) auto; padding: 8px 6px; }
.date { text-align: center; line-height: 1.1; border-radius: 8px; padding: 4px 0; background: var(--sunken); }
.date b { display: block; font-size: 17px; font-weight: 600; }
.date span { font-size: 10.5px; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; font-weight: 600; }
.date.over { background: var(--red-soft); color: var(--red); } .date.over span { color: var(--red); }
.date.none { background: transparent; color: var(--faint); font-size: 11px; }
.row .t { min-width: 0; }
.row .t b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t span { color: var(--muted); font-size: 13px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .r { text-align: right; display: grid; gap: 2px; justify-items: end; }
.row .r .amt { font-weight: 600; font-variant-numeric: tabular-nums; }
.row .r .when { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.row .r .when.over { color: var(--red); font-weight: 600; }
.row .r .when.soon { color: var(--amber); font-weight: 600; }
.row.done b { text-decoration: line-through; color: var(--muted); }
.gh { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 600; margin: 18px 8px 4px; }
.gh:first-child { margin-top: 2px; }
.gh.over { color: var(--red); }
.totals { display: flex; gap: 22px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
.totals b { color: var(--fg); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 4px; }
.attn .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 15px; background: var(--sunken); }
.attn .ico.red { background: var(--red-soft); color: var(--red); } .attn .ico.amber { background: var(--amber-soft); color: var(--amber); } .attn .ico.blue { background: var(--brand-soft); color: var(--brand); }
.attn .row { grid-template-columns: 40px minmax(0, 1fr) auto; }
.quiet { color: var(--muted); font-size: 13.5px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }

/* tables */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: var(--hover); }
tbody tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.rsec td:first-child { white-space: nowrap; }
td .sub { color: var(--muted); font-size: 12.5px; }
.namecell b { font-weight: 600; }

/* contract page */
.rec-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.rec-head h1 { font-size: 26px; letter-spacing: -.01em; }
.rec-head .meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 6px; color: var(--muted); font-size: 13.5px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; }
.stats > div { padding: 16px 20px; display: grid; gap: 2px; min-width: 0; }
.stats > div + div { border-left: 1px solid var(--line); }
.stats .k { font-size: 12.5px; color: var(--muted); }
.stats .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stats > div:nth-child(3) { border-left: 0; } .stats > div:nth-child(n+3) { border-top: 1px solid var(--line); } }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--brand); }
.tabs .cnt { background: var(--amber-soft); color: var(--amber); border-radius: 8px; font-size: 11px; padding: 1px 6px; margin-left: 4px; font-weight: 700; }
.col-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.col-h h3 { font-size: 15px; }
.col-h h3.we { color: var(--we); } .col-h h3.they { color: var(--they); }
.notice { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 16px; border-radius: 12px; background: var(--amber-soft); color: var(--amber); }
.notice.ai { background: var(--ai-soft); color: var(--ai); }
.notice .btn { color: inherit; }
.kv { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr); gap: 0; }
.kv > div { padding: 10px 0; border-bottom: 1px solid var(--line); }
.kv .k { color: var(--muted); font-size: 13.5px; padding-right: 16px; }
.kv .v { overflow-wrap: anywhere; }
.kv .v .srcl { margin-left: 8px; font-size: 12px; }
.unv { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--amber); margin-left: 8px; white-space: nowrap; }
.cfl { color: var(--red); }
.grp { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 600; margin: 22px 0 2px; }
.grp:first-child { margin-top: 0; }
@media (max-width: 560px) { .kv { grid-template-columns: 1fr; } .kv .k { border-bottom: 0; padding-bottom: 0; } }
.addrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto auto; gap: 8px; margin-top: 10px; }
.addrow input, .addrow select { border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 8px; background: var(--surface); min-width: 0; }
@media (max-width: 640px) { .addrow { grid-template-columns: 1fr 1fr; } .addrow #nobText { grid-column: 1 / -1; } }
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { padding: 9px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; }
.hist li time { color: var(--faint); font-size: 12px; white-space: nowrap; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(16, 24, 40, .35); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--surface); z-index: 41; box-shadow: var(--shadow-lg); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer header { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.drawer header h2 { font-size: 18px; }
.drawer .body { overflow-y: auto; padding: 16px 20px; display: grid; gap: 16px; align-content: start; }
.drawer footer { border-top: 1px solid var(--line); padding: 12px 20px; display: flex; gap: 8px; flex-wrap: wrap; }
.drawer .lbl { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.drawer blockquote { margin: 0; padding: 10px 12px; background: var(--sunken); border-radius: 8px; border-left: 3px solid var(--brand); font-size: 13.5px; }
.drawer textarea, .drawer select { width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; background: var(--surface); }
.drawer textarea { min-height: 70px; resize: vertical; }
.side-pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 10px; background: var(--we-soft); color: var(--we); }
.side-pill.they { background: var(--they-soft); color: var(--they); }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slidein .18s ease-out; } @keyframes slidein { from { transform: translateX(30px); opacity: .6; } } }

/* menus / popovers */
.menu { position: fixed; z-index: 60; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); min-width: 240px; max-width: 360px; padding: 6px; max-height: 70vh; overflow-y: auto; }
.menu h4 { padding: 8px 10px 4px; font-size: 11.5px; color: var(--faint); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.menu button { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; }
.menu button:hover { background: var(--hover); }
.menu .sub { color: var(--faint); font-size: 12.5px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
.menu p { margin: 0; padding: 4px 10px 8px; color: var(--muted); font-size: 13px; }
.menu .ritem { display: grid; gap: 1px; }
.menu .ritem small { color: var(--muted); font-size: 12px; }

/* AI panel */
.ai-panel { position: fixed; right: 20px; bottom: 20px; z-index: 45; width: min(420px, calc(100% - 24px)); height: min(620px, calc(100% - 100px)); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lg); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; }
.ai-panel header { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ai-panel header h2 { font-size: 15px; display: flex; gap: 8px; align-items: center; }
.ai-panel .ctx { font-size: 12px; color: var(--muted); }
.thread { overflow-y: auto; padding: 16px; display: grid; gap: 12px; align-content: start; }
.msg { max-width: 92%; padding: 10px 13px; border-radius: 14px; white-space: pre-wrap; line-height: 1.5; overflow-wrap: anywhere; font-size: 14px; }
.msg.u { justify-self: end; background: var(--brand); color: var(--brand-ink); border-bottom-right-radius: 4px; }
.msg.a { justify-self: start; background: var(--sunken); border-bottom-left-radius: 4px; }
.msg.a.err { color: var(--red); }

rge","owner":"","note":""},{"id":"ex1","side":"theirs","text":"Pay quarterly subscription invoice at the 2027 rate","category":"Payment","due":"2027-02-15","recurrence":"Quarterly","amount":132300,"src":"the Subscription Fee then in effect increases by 5%","page":2,"status":"open","conditional":false,"condition":"","graceDays":null,"lateTerms":"1.0% per month late charge","owner":"","note":"","until":"2027-12-31"},{"id":"ex2","side":"theirs","text":"Certify licensed bed count for the year","category":"Reporting","due":"2027-01-31","recurrence":"Annual","amount":null,"src":"will certify its Licensed Beds each January","page":7,"status":"open","conditional":false,"condition":"","graceDays":null,"lateTerms":"","owner":"","note":""},{"id":"ex3","side":"theirs","text":"Report any change in licensed beds within 30 days","category":"Notice","due":null,"recurrence":"Ongoing","amount":null,"src":"Client will notify Provider within 30 days after any change in its Licensed Beds","page":7,"status":"open","conditional":false,"condition":"","graceDays":null,"lateTerms":"","owner":"","note":""},{"id":"ex4","side":"theirs","text":"Pay Final Acceptance installment","category":"Payment","due":"2025-08-30","recurrence":"One-time","amount":72000,"src":"30% ($72,000) upon Final Acceptance","page":1,"status":"done","conditional":false,"condition":"","graceDays":null,"lateTerms":"","owner":"","note":""},{"id":"ex5","side":"mine","text":"Keep the platform available 99.5% of each month (credits of 5-20% if missed)","category":"Service level","due":null,"recurrence":"Ongoing","amount":null,"src":"make the Services available at least 99.5% of each calendar month","page":2,"status":"open","conditional":false,"condition":"","graceDays":null,"lateTerms":"","owner":"","note":""},{"id":"ex6","side":"mine","text":"Notify the hospital of any security incident within 48 hours","category":"Data & security","due":null,"recurrence":"Ongoing","amount":null,"src":"within 48 hours after confirming a Security Incident","page":5,"status":"open","conditional":false,"condition":"","graceDays":null,"lateTerms":"","owner":"","note":""},{"id":"ex7","side":"mine","text":"Provide SOC 2 report and penetration test summary on request","category":"Reporting","due":null,"recurrence":"Annual","amount":null,"src":"Provider will obtain a SOC 2 Type II report and an independent penetration test each year","page":5,"status":"open","conditional":false,"condition":"","graceDays":null,"lateTerms":"","owner":"","note":""},{"id":"ex8","side":"mine","text":"Maintain $2M/$4M general liability and $10M cyber insurance","category":"Insurance","due":null,"recurrence":"Ongoing","amount":null,"src":"technology errors and omissions and cyber liability insurance of at least $10,000,000","page":6,"status":"open","conditional":false,"condition":"","graceDays":null,"lateTerms":"","owner":"","note":""},{"id":"ex9","side":"mine","text":"Last day to send non-renewal notice (if not renewing)","category":"Notice","due":"2027-09-02","recurrence":"One-time","amount":null,"src":"at least 120 days before the end of the then-current term","page":1,"status":"open","conditional":false,"condition":"","graceDays":null,"lateTerms":"","owner":"","note":""}],"sourceText":"[[Page 1]]\nMaster Subscription and Services Agreement\nCareConnect Patient Management Platform: Lakeshore Private Hospital\nSample contract for testing purposes only. All parties are fictional. Not legal advice.\nThis Agreement is entered into as of January 1, 2025 (the \"Effective Date\") between\nMediLink Systems, Inc., a Delaware corporation (\"Provider\"), and Lakeshore Private\nHospital, a licensed 220-bed private hospital (\"Client\").\n1. Services\n1.1 Provider grants Client access to the CareConnect platform, including patient\nregistration, scheduling, billing integration, patient communications and reporting (the\n\"Services\"), for use at Client's main campus.\n1.2 Provider will implement the Services in accordance with the project plan agreed by the\nparties. The target date for Go-Live is July 1, 2025.\n2. Term and Renewal\n2.1 Initial Term. The Initial Term is 36 months, from the Effective Date through December\n31, 2027.\n2.2 Renewal. After the Initial Term, this Agreement renews automatically for successive\n12-month terms unless either party gives written notice of non-renewal at least 120 days\nbefore the end of the then-current term.\n3. Fees\n3.1 Implementation Fee. Client will pay a one-time Implementation Fee of $240,000 in\nthree installments:\n(a) 30% ($72,000) upon signing;\n(b) 40% ($96,000) upon Go-Live;\n(c) 30% ($72,000) upon Final Acceptance, which occurs 60 days after Go-Live unless\nClient has reported an unresolved Critical Defect in writing.\n3.2 Subscription Fee. The Subscription Fee for the first contract year is $480,000,\ninvoiced quarterly in advance at $120,000 per quarter, on the first day of each calendar\nquarter.\n\n[[Page 2]]\n3.3 Annual Escalator. On each anniversary of the Effective Date, the Subscription Fee\nthen in effect increases by 5%.\n3.4 Bed Capacity. The Subscription Fee covers up to 250 licensed beds. For each licensed\nbed above 250, Client will pay an additional $90 per bed per month.\n3.5 Optional Telehealth Module. If Client activates the Telehealth Module by signed Order\nForm, Client will pay $6,000 per month from the activation date stated in that Order Form.\n3.6 All fees exclude applicable taxes.\n4. Payment\n4.1 Invoices are payable within 45 days of the invoice date.\n4.2 Overdue amounts accrue a late charge of 1.0% per month.\n5. Service Levels and Credits\n5.1 Provider will make the Services available at least 99.5% of each calendar month,\nexcluding scheduled maintenance.\n5.2 If monthly availability falls below the target, Client is entitled to a service credit\ncalculated on one-third of the quarterly Subscription Fee:\nBelow 99.5% but at least 99.0%: 5% credit\nBelow 99.0% but at least 98.0%: 10% credit\nBelow 98.0%: 20% credit\n5.3 Credits are applied to the next invoice and are Client's sole financial remedy for\navailability failures, except as stated in Section 6.3.\n6. Termination\n6.1 For Cause. Either party may terminate on written notice if the other party materially\nbreaches this Agreement and fails to cure within 30 days of notice.\n6.2 For Convenience. After December 31, 2026, Client may terminate for convenience on\n180 days' written notice. Client will pay an early termination fee equal to 50% of the\nSubscription Fees that would have been payable from the termination date to the end of\nthe Initial Term, capped at $250,000.\n6.3 Chronic Availability Failure. If monthly availability is below 98.0% in three consecutive\nmonths, Client may terminate without any early termination fee.\n\n[[Page 3]]\n6.4 Effect of Termination. Provider will return Client's data in a standard export format\nwithin 30 days of termination and then delete it, subject to legal retention requirements.\n7. Data Protection\n7.1 The parties will sign Provider's standard Business Associate Agreement, which is\nincorporated into this Agreement and governs protected health information.\n7.2 Provider will maintain administrative, technical and physical safeguards consistent\nwith HIPAA requirements.\n8. Confidentiality\nEach party will protect the other's confidential information with at least reasonable care\nand use it only to perform this Agreement.\n9. Limitation of Liability\nEach party's total liability under this Agreement is limited to the fees paid by Client in the\n12 months before the claim arose. Neither party is liable for indirect or consequential\ndamages. This limit does not apply to breaches of the Business Associate Agreement or\nto Client's payment obligations.\n10. Intellectual Property and Data Rights\n10.1 Provider Property. As between the parties, Provider and its licensors own all right,\ntitle and interest in the Services, the CareConnect software, the Documentation,\ninterfaces, templates and algorithms, and in all improvements and derivative works of\nthem. Except for the limited right to use the Services granted in this Agreement, no rights\nare transferred to Client.\n10.2 Client Data. As between the parties, Client owns all Client Data, including protected\nhealth information (\"PHI\"). Client grants Provider a non-exclusive, limited license to host,\nprocess, transmit and display Client Data solely to provide the Services and support, and\nas permitted by the Business Associate Agreement.\n10.3 De-identified Data. Provider may create de-identified data from Client Data only as\npermitted by the Business Associate Agreement and 45 C.F.R. \u00a7 164.514, and may use it\nonly to operate, secure and improve the Services. Provider will not re-identify de-\nidentified data, sell it, or disclose it in a form that identifies Client or any individual.\n\n[[Page 4]]\n10.4 Restrictions. Client will not (a) copy, modify or create derivative works of the\nServices; (b) reverse engineer or attempt to extract source code, except where law\npermits; (c) sublicense, resell or make the Services available to third parties other than\nfacilities listed in an Order Form; (d) circumvent security controls or usage limits; or (e)\nuse the Services to send unlawful or unsolicited marketing messages.\n10.5 Feedback. Provider may use suggestions Client provides about the Services without\nobligation, provided Provider does not disclose Client's confidential information or PHI.\n10.6 Third-Party Components. The Services include third-party and open-source\ncomponents, which are governed by their own licenses to the extent those licenses\nrequire.\n11. Client Responsibilities\n11.1 Client will designate a project sponsor and a system administrator with authority to\nmake decisions and approve deliverables for Client.\n11.2 Client is responsible for the accuracy and lawfulness of Client Data, for any patient\nconsents and notices required by law, and for its Authorized Users' compliance with this\nAgreement.\n11.3 Client will keep user credentials confidential, promptly deactivate accounts of\ndeparted personnel, and notify Provider promptly of any suspected unauthorized use.\n11.4 Clinical Responsibility. The Services support administrative, scheduling and\ncommunications functions. They are not a medical device, do not provide medical advice,\ndiagnosis or treatment, and do not replace the professional judgment of Client's\nclinicians.\n11.5 Client will maintain the network, devices and browsers that meet the minimum\nrequirements stated in the Documentation.\n11.6 Client will give Provider timely access to personnel, systems and information\nreasonably needed for implementation. Dates in the project plan extend day-for-day for\ndelays caused by Client. If Go-Live is delayed by more than 60 days solely because of\nClient, Provider may invoice the Go-Live installment under Section 3.1(b) as if Go-Live had\noccurred.\n12. Security and Business Continuity\n12.1 Safeguards. Provider will maintain a written information security program with\nadministrative, technical and physical safeguards appropriate for PHI, including: (a)\nencryption of Client Data in transit (TLS 1.2 or higher) and at rest (AES-256 or equivalent);\n\n[[Page 5]]\n(b) role-based access controls, with multi-factor authentication for administrative access;\n(c) logging of access to PHI, with logs retained for at least 12 months; (d) vulnerability\nmanagement, with critical vulnerabilities remediated within 30 days of discovery; and (e)\nbackground checks and annual security and HIPAA training for personnel with access to\nPHI.\n12.2 Hosting Location. Provider will host Client Data in data centers located in the United\nStates and will not permit access to PHI from outside the United States without Client's\nprior written consent.\n12.3 Assessments. Provider will obtain a SOC 2 Type II report and an independent\npenetration test each year. On request, no more than once per year, Provider will give\nClient the current SOC 2 report and a summary of penetration test findings, both as\nconfidential information.\n12.4 Backup and Recovery. Provider will take encrypted backups of Client Data at least\ndaily, maintain a disaster recovery plan with a recovery point objective of 4 hours and a\nrecovery time objective of 8 hours, and test the plan at least annually.\n12.5 Security Incidents. Provider will notify Client without unreasonable delay, and in any\nevent within 48 hours after confirming a Security Incident affecting Client Data. Provider\nwill give Client the information required by the Business Associate Agreement and will\ncooperate in investigation and remediation.\n12.6 Breach Response Costs. To the extent a Security Incident results from Provider's\nbreach of this Section 12 or the Business Associate Agreement, Provider will bear the\nreasonable costs of legally required notifications, 12 months of credit monitoring where\napplicable, and forensic investigation.\n12.7 Audit. Once in any 12-month period, on 30 days' written notice, Client or an\nindependent auditor bound by confidentiality may audit Provider's compliance with this\nSection 12, remotely or on site during business hours. Client bears the cost of the audit\nunless it reveals material non-compliance. Client may also audit after a Security Incident\nor when a regulator requires it.\n13. Warranties and Disclaimers\n13.1 Provider Warranties. Provider warrants that (a) the Services will perform materially in\naccordance with the Documentation; (b) implementation and support services will be\nperformed in a professional and workmanlike manner; (c) Provider will not knowingly\nintroduce malicious code into the Services; and (d) Provider will comply with the laws that\napply to its provision of the Services, including HIPAA.\n\n[[Page 6]]\n13.2 Remedy. For a breach of Section 13.1(a), Provider will correct the nonconformity or\nprovide a workaround within a reasonable time. If Provider cannot do so within 60 days\nafter written notice, Client may terminate the affected Services and receive a refund of\nprepaid fees for the period after termination.\n13.3 Client Warranties. Client warrants that it has the authority to enter into this\nAgreement and the rights needed to provide Client Data to Provider.\n13.4 Disclaimer. Except as expressly stated in this Agreement, the Services are provided\n\"as is.\" Provider disclaims all implied warranties, including merchantability, fitness for a\nparticular purpose and non-infringement, and does not warrant that the Services will be\nuninterrupted or error-free.\n14. Indemnification\n14.1 By Provider. Provider will defend Client against any third-party claim alleging that the\nServices infringe a United States patent, copyright or trademark or misappropriate a trade\nsecret, and will pay damages finally awarded or agreed in settlement and reasonable\ndefense costs. Provider has no obligation to the extent a claim arises from Client Data,\nmodification of the Services by anyone other than Provider, combination with items\nProvider did not supply, or use in breach of this Agreement. If the Services become\nsubject to such a claim, Provider may procure the right for Client to continue using them,\nmodify them to be non-infringing, or terminate the affected Services and refund prepaid\nfees for the period after termination.\n14.2 By Client. Client will defend Provider against any third-party claim arising from Client\nData, from Client's use of the Services in violation of law or this Agreement, or from\nclinical care provided by Client, and will pay damages finally awarded or agreed in\nsettlement and reasonable defense costs.\n14.3 Procedure. The indemnified party will give prompt written notice of the claim, allow\nthe indemnifying party sole control of the defense and settlement, and cooperate at the\nindemnifying party's expense. A settlement that admits fault for the indemnified party\nrequires its consent.\n14.4 This Section 14 states each party's entire obligation and the other party's exclusive\nremedy for the claims it covers.\n15. Insurance\nDuring the term of this Agreement, Provider will maintain (a) commercial general liability\ninsurance of at least $2,000,000 per occurrence and $4,000,000 in the aggregate; (b)\ntechnology errors and omissions and cyber liability insurance of at least $10,000,000 per\n\n[[Page 7]]\nclaim; and (c) workers' compensation insurance as required by law. Provider will provide\ncertificates of insurance on request and will give Client 30 days' notice before\ncancellation of a required policy.\n16. Invoice Disputes, Suspension and Usage Verification\n16.1 Disputes. If Client disputes an invoice in good faith, Client will notify Provider in\nwriting within 30 days after the invoice date, explain the basis, and pay the undisputed\nportion on time. The parties will work in good faith to resolve the dispute within 30 days.\n16.2 Suspension. If an undisputed amount is more than 60 days overdue, Provider may,\nafter a further 15 days' written notice addressed to Client's Chief Financial Officer and\nsystem administrator, restrict new data entry and optional modules. Provider will not\nsuspend read-only access to Client Data needed for patient care. Suspension does not\nrelieve Client of its payment obligations.\n16.3 Bed Count. Client will notify Provider within 30 days after any change in its Licensed\nBeds and will certify its Licensed Beds each January. Provider may request a copy of\nClient's current license once per year. Additional bed fees under Section 3.4 apply from\nthe date the count exceeded 250, but not earlier than 12 months before Provider\ndiscovered the increase.\n17. Regulatory Compliance\n17.1 HIPAA. Each party will comply with the Health Insurance Portability and\nAccountability Act, the HITECH Act and their implementing regulations, as they apply to\nit. Provider is a business associate of Client.\n17.2 Exclusion. Provider represents that neither it nor any person performing the Services\nis excluded from participation in a federal health care program, and will notify Client\nwithin 5 business days if that changes. Client may terminate this Agreement immediately\nif Provider is excluded.\n17.3 No Referrals. Nothing in this Agreement requires or is conditioned on the referral of\npatients or business between the parties. The fees are consistent with fair market value\nfor the Services, and neither party offers or receives remuneration to induce referrals, in\naccordance with the federal Anti-Kickback Statute.\n17.4 Information Blocking. Provider will not engage in any practice that constitutes\ninformation blocking under 45 C.F.R. Part 171 with respect to Client Data.\n17.5 Accessibility. Provider will use reasonable efforts to keep patient-facing interfaces\nconsistent with WCAG 2.1 Level AA.\n\n[[Page 8]]\n18. Force Majeure\nNeither party is liable for a failure or delay caused by events beyond its reasonable\ncontrol, such as natural disasters, war, terrorism, government action, pandemics,\nwidespread utility or internet failures not caused by that party, and labor disputes other\nthan its own. This Section does not excuse payment obligations or Provider's obligations\nunder Section 12.4. The affected party will give prompt notice and use reasonable efforts\nto resume performance. If the event continues for more than 30 days, the other party may\nterminate the affected Services without liability.\n19. Assignment, Subcontractors and Change of Control\n19.1 Assignment. Neither party may assign this Agreement without the other's prior\nwritten consent, which will not be unreasonably withheld, except that either party may\nassign it on written notice to a successor in a merger, acquisition or sale of substantially\nall of its related assets, if the successor assumes all obligations in writing.\n19.2 Subcontractors. Provider may use subcontractors but remains responsible for their\nperformance. Any subcontractor with access to PHI must be bound by a business\nassociate agreement.\n19.3 Change of Control of Provider. If Provider undergoes a change of control in which the\nacquirer operates hospitals or health systems that compete with Client, Client may\nterminate this Agreement without an early termination fee by giving 60 days' written\nnotice within 90 days after Provider notifies Client of the change of control.\n20. Dispute Resolution\n20.1 Escalation. A party with a dispute will give written notice. Designated executives of\nboth parties will meet within 15 days and try to resolve the dispute within 30 days after\nthe notice.\n20.2 Mediation. If the executives cannot resolve it, the parties will try non-binding\nmediation, in Wilmington, Delaware or by video conference, and will share the mediator's\nfees equally.\n20.3 Courts. If mediation fails, the state and federal courts located in Delaware have\nexclusive jurisdiction, and each party consents to that jurisdiction. To the extent the law\nallows, each party waives trial by jury.\n20.4 Equitable Relief; Continued Performance. Either party may seek injunctive relief at\nany time to protect its confidential information or intellectual property. Unless this\nAgreement has been terminated, both parties will continue to perform during a dispute.\n\n[[Page 9]]\n21. General Provisions\n21.1 Governing Law. This Agreement is governed by the laws of the State of Delaware,\nwithout regard to its conflict-of-laws rules. The United Nations Convention on Contracts\nfor the International Sale of Goods does not apply.\n21.2 Entire Agreement; Order of Precedence. This Agreement, including its Exhibits, the\nBusiness Associate Agreement and any Order Forms, is the entire agreement of the\nparties on its subject matter and replaces all earlier proposals and agreements. If\ndocuments conflict, the order of precedence is: the Business Associate Agreement (for\nPHI), the body of this Agreement, the Exhibits, and then Order Forms, unless an Order\nForm expressly states that it overrides a specific Section.\n21.3 Amendment and Waiver. An amendment must be in writing and signed by both\nparties. A waiver is effective only if in writing, and a waiver of one breach does not waive\nany other.\n21.4 Notices. Notices must be in writing and delivered by hand, by nationally recognized\ncourier, or by email with confirmation of receipt, to the contacts in Exhibit E. Notices of\nbreach, non-renewal or termination must be sent by courier, with a copy by email. A notice\nis effective on receipt.\n21.5 Independent Contractors; No Third-Party Beneficiaries. The parties are\nindependent contractors. This Agreement creates no partnership, agency or employment\nrelationship and confers no rights on any third party.\n21.6 Publicity. Neither party will use the other's name or logo in marketing without prior\nwritten consent.\n21.7 Non-Solicitation. During the term and for 12 months afterward, neither party will\nsolicit for employment the other party's employees who worked directly on this\nAgreement. General advertising not targeted at those employees is permitted.\n21.8 Severability. If a provision is held unenforceable, it will be enforced to the extent\npermitted and the rest of this Agreement remains in effect.\n21.9 Survival. Provisions that by their nature should survive termination will survive,\nincluding accrued payment obligations and Sections 6.4, 7, 8, 9, 10, 14, 20 and 21.\n21.10 Counterparts; Electronic Signatures. This Agreement may be signed in\ncounterparts and by electronic signature, each of which is an original.\n21.11 Interpretation. Headings are for convenience only. The word \"including\" means\n\"including without limitation.\" This Agreement will not be construed against either party\nas drafter.\n\n[[Page 10]]\nSignatures\nMediLink Systems, Inc. By: Dana Whitfield, Chief Executive Officer Date: January 1, 2025\nLakeshore Private Hospital By: Robert Alvarez, Chief Financial Officer Date: January 1,\n2025\nExhibit A: Definitions\nAuthorized User: an employee, contractor or medical staff member of Client whom\nClient permits to use the Services.\nBusiness Associate Agreement: the agreement between the parties governing\nProvider's use and disclosure of PHI.\nBusiness Day: a day other than a Saturday, Sunday or U.S. federal holiday.\nClient Data: all data, including PHI, that Client or its Authorized Users enter into or\ngenerate through the Services.\nContract Year: each 12-month period beginning on the Effective Date or an\nanniversary of it.\nCritical Defect: a defect that prevents patient registration or scheduling, or materially\ncorrupts Client Data, and has no reasonable workaround.\nDocumentation: Provider's user guides and technical documentation for the Services,\nas updated from time to time.\nGo-Live: the first day the Services are used in production to register or schedule\npatients at Client's main campus, as confirmed in writing by Client, which Client will\nnot unreasonably withhold.\nLicensed Beds: the number of inpatient beds licensed for Client's main campus by the\nstate health authority.\nOrder Form: a signed document that adds modules, locations or services under this\nAgreement.\nSecurity Incident: unauthorized access to, or acquisition, use or disclosure of, Client\nData in Provider's possession or control.\nExhibit B: Services Description and Support\nB.1 Included Services\nPatient registration and demographics management\nAppointment and resource scheduling\nPatient portal and automated patient communications\n\n[[Page 11]]\nBilling system integration through up to four HL7 or FHIR interfaces\nStandard reports and dashboards\nTraining during implementation: up to 40 hours, delivered on site or virtually\nInterfaces beyond four, custom reports and additional training are quoted in an Order\nForm at the rates in Exhibit C.\nB.2 Support\nProvider will provide support 24 hours a day, 365 days a year, by phone, email and web\nportal. Response and target resolution times are:\nThese times are targets and do not create service credits. Service credits are governed\nsolely by Section 5.\nB.3 Maintenance\nProvider will perform scheduled maintenance on Sundays between 1:00 a.m. and 5:00 a.m.\nEastern Time, up to 8 hours per month, with at least 5 days' notice. Scheduled\nmaintenance is excluded from the availability calculation in Section 5. Emergency\nmaintenance is included in the calculation.\nSeverity Definition Response Target resolution or\nworkaround\n1 Critical Defect or Services\nunavailable\n30 minutes 4 hours\n2 Major function degraded,\nworkaround exists\n2 hours 1 Business Day\n3 Minor function affected 1 Business\nDay\n5 Business Days\n4 Question or enhancement request 2 Business\nDays\nNext scheduled release\n\n[[Page 12]]\nExhibit C: Fee Schedule\nC.1 Recurring Fees\nThe 5% annual escalator in Section 3.3 continues to apply in any renewal term.\nC.2 Other Charges\nC.3 Invoicing\nSubscription Fees are invoiced on January 1, April 1, July 1 and October 1. Payment is due\n45 days after the invoice date. Invoices are sent by email to the billing contact in Exhibit E.\nContract Year Period Annual Subscription Fee Quarterly invoice\n1 Jan 1, 2025 to Dec 31, 2025 $480,000 $120,000\n2 Jan 1, 2026 to Dec 31, 2026 $504,000 $126,000\n3 Jan 1, 2027 to Dec 31, 2027 $529,200 $132,300\nItem Amount Billing\nImplementation Fee $240,000 30% / 40% / 30% per\nSection 3.1\nAdditional Licensed Beds above\n250\n$90 per bed per month With the next quarterly\ninvoice\nTelehealth Module $6,000 per month From the activation date\nin the Order Form\nAdditional training $1,500 per day, plus\nreasonable travel\nMonthly in arrears\nProfessional services (custom\nreports, extra interfaces)\n$185 per hour, or fixed price\nin an Order Form\nMonthly in arrears\n\n[[Page 13]]\nExhibit D: Implementation and Acceptance\nD.1 Implementation Phases\nD.2 Acceptance Criteria\nRegistration :2970,"src":"Provider will credit Client one month of Subscription Fees","page":2,"status":"open","conditional":true,"condition":"Only if the agreement renews for a second term","graceDays":null,"lateTerms":"","owner":"","note":""},{"id":"ex8","side":"mine","text":"Last day to send non-renewal notice (if not renewing)","category":"Notice","due":"2026-12-30","recurrence":"One-time","amount":null,"src":"at least 60 days before the end of the then-current term","page":1,"status":"open","conditional":false,"condition":"","graceDays":null,"lateTerms":"","owner":"","note":""}],"sourceText":"[[Page 1]]\nSubscription Agreement\nCareConnect Patient Management Platform: Brightsight Eye Clinic\nSample contract for testing purposes only. All parties are fictional. Not legal advice.\nThis Agreement is entered into as of March 1, 2026 (the \"Effective Date\") between\nMediLink Systems, Inc., a Delaware corporation (\"Provider\"), and Brightsight Eye Clinic,\nP.A., an ophthalmology practice (\"Client\").\n1. Services\n1.1 Provider grants Client access to the CareConnect platform, including patient\nregistration, appointment scheduling, automated reminders and reporting (the\n\"Services\").\n1.2 Imaging Integration Add-on. Provider will also connect the platform to Client's retinal\nand diagnostic imaging systems (the \"Imaging Add-on\").\n2. Term and Renewal\n2.1 Initial Term. The Initial Term is 12 months, from March 1, 2026 through February 28,\n2027.\n2.2 Renewal. After the Initial Term, this Agreement renews automatically for successive\n12-month terms unless either party gives written notice of non-renewal at least 60 days\nbefore the end of the then-current term.\n3. Fees\n3.1 Onboarding Fee. Client will pay a one-time Onboarding Fee of $9,500 upon signing.\n3.2 Subscription Fee. Client will pay $495 per provider per month. Client has 6 providers\nat signing, so the initial monthly Subscription Fee is $2,970. Client must maintain at least 4\nproviders during the Initial Term. Client may change the number of providers on 30 days'\nwritten notice.\n3.3 Imaging Add-on Fee. Client will pay $1,200 per month for the Imaging Add-on,\nbeginning on the earlier of the Imaging Go-Live date or September 1, 2026.\n3.4 Messaging. The Subscription Fee includes 3,000 SMS reminders per month. Each\nadditional message costs $0.04 and is billed monthly in arrears.\n\n[[Page 2]]\n3.5 Price Lock and Renewal Increase. Fees are fixed during the Initial Term. For each\nrenewal term, Provider may increase fees by up to the lesser of the annual U.S. CPI-U\nincrease or 4%, provided Provider notifies Client in writing at least 90 days before the\nrenewal term begins.\n3.6 Renewal Loyalty Credit. If this Agreement renews for a second 12-month term,\nProvider will credit Client one month of Subscription Fees (excluding the Imaging Add-on\nand messaging charges) against the first invoice of the renewal term.\n4. Billing and Payment\n4.1 Subscription and Add-on Fees are invoiced monthly in advance, on the first day of each\nmonth. Messaging overage is invoiced monthly in arrears.\n4.2 Invoices are payable within 30 days of the invoice date. Overdue amounts accrue a\nlate charge of 1.5% per month.\n5. Service Levels\n5.1 Provider will use commercially reasonable efforts to make the Services available 99.0%\nof each month.\n5.2 If availability falls below 99.0% in a month, Client will receive a credit of 10% of that\nmonth's Subscription Fee.\n6. Termination\n6.1 For Cause. Either party may terminate on written notice if the other party materially\nbreaches this Agreement and fails to cure within 30 days.\n6.2 For Convenience during the Initial Term. Client may terminate for convenience on 90\ndays' written notice and must pay an early termination fee equal to three months of\nSubscription Fees at the rate then in effect.\n6.3 For Convenience after the Initial Term. During any renewal term, either party may\nterminate on 60 days' written notice without a termination fee.\n6.4 On termination, Provider will return Client's data in a standard format within 30 days.\n7. Data Protection\nThe parties will sign Provider's standard Business Associate Agreement, which governs\nprotected health information. Provider will maintain safeguards consistent with HIPAA\nrequirements.\n\n[[Page 3]]\n8. Confidentiality\nEach party will protect the other's confidential information with at least reasonable care\nand use it only to perform this Agreement.\n9. Limitation of Liability\nEach party's total liability under this Agreement is limited to the fees paid by Client in the\n12 months before the claim arose. Neither party is liable for indirect or consequential\ndamages.\n10. Intellectual Property and Data Rights\n10.1 Provider Property. Provider and its licensors own all right, title and interest in the\nServices, the CareConnect software, the Documentation and all improvements to them.\nClient receives only the limited right to use the Services during the term.\n10.2 Client Data. Client owns all Client Data, including protected health information\n(\"PHI\") and diagnostic images and related imaging metadata. Client grants Provider a\nlimited, non-exclusive license to host, process and transmit Client Data solely to provide\nthe Services and support, and as permitted by the Business Associate Agreement.\n10.3 De-identified Data. Provider may create de-identified data only as permitted by the\nBusiness Associate Agreement and 45 C.F.R. \u00a7 164.514, and may use it only to operate,\nsecure and improve the Services. Provider will not re-identify it or sell it.\n10.4 Restrictions. Client will not copy or modify the Services, reverse engineer them\nexcept where law permits, resell or sublicense them, circumvent security or usage limits,\nor use them to send unlawful or unsolicited messages.\n10.5 Feedback. Provider may use Client's suggestions about the Services without\nobligation, provided it does not disclose Client's confidential information or PHI.\n11. Client Responsibilities\n11.1 Client will name an administrator who can approve configuration decisions and\nmanage user accounts.\n11.2 Client is responsible for the accuracy and lawfulness of Client Data and for its users'\ncompliance with this Agreement. Client will keep credentials confidential and deactivate\naccounts of departed staff promptly.\n\n[[Page 4]]\n11.3 Patient Messaging. Client is responsible for obtaining and recording patient consent\nto receive text messages and automated calls as required by law, including the Telephone\nConsumer Protection Act. Provider will honor patient opt-out requests received through\nthe Services.\n11.4 Imaging Integration. Client will arrange for its imaging equipment vendors to\ncooperate with Provider and will keep any third-party licenses needed for the integration\nin force. A delay in the Imaging Go-Live caused by Client or its vendors does not postpone\nthe fee start date in Section 3.3.\n11.5 Clinical Responsibility. The Services support administrative, scheduling and\ncommunications functions. They are not a medical device and do not provide medical\nadvice, diagnosis or treatment. Clinical decisions remain the responsibility of Client's\nclinicians.\n11.6 Provider Count. Client will notify Provider of any change in its number of providers in\naccordance with Section 3.2 and will confirm the number of active providers within 15\ndays after Provider's written request, no more than twice per year.\n12. Security and Business Continuity\n12.1 Safeguards. Provider will maintain a written information security program with\nadministrative, technical and physical safeguards appropriate for PHI, including\nencryption of Client Data in transit (TLS 1.2 or higher) and at rest (AES-256 or equivalent),\nrole-based access controls, multi-factor authentication for administrative access, logging\nof access to PHI, and security training for personnel with access to PHI.\n12.2 Hosting Location. Provider will host Client Data in the United States and will not\npermit access to PHI from outside the United States without Client's prior written\nconsent.\n12.3 Assessments. Provider will obtain a SOC 2 Type II report and an independent\npenetration test each year, and will provide the current SOC 2 report to Client on request,\nno more than once per year, as confidential information.\n12.4 Backup and Recovery. Provider will take encrypted backups of Client Data at least\ndaily and maintain a disaster recovery plan with a recovery point objective of 24 hours\nand a recovery time objective of 24 hours.\n12.5 Security Incidents. Provider will notify Client without unreasonable delay, and in any\nevent within 72 hours after confirming a Security Incident affecting Client Data, and will\ngive Client the information required by the Business Associate Agreement and cooperate\nin remediation.\n\n[[Page 5]]\n12.6 Security Questionnaire. Once per year, Provider will answer a reasonable written\nsecurity questionnaire from Client within 30 days.\n13. Warranties and Disclaimers\n13.1 Provider Warranties. Provider warrants that (a) the Services will perform materially in\naccordance with the Documentation; (b) onboarding and support services will be\nperformed in a professional manner; (c) Provider will not knowingly introduce malicious\ncode; and (d) Provider will comply with the laws that apply to its provision of the Services,\nincluding HIPAA.\n13.2 Remedy. For a breach of Section 13.1(a), Provider will correct the problem or provide a\nworkaround within a reasonable time. If it cannot do so within 45 days after written\nnotice, Client may terminate the affected Services without an early termination fee and\nreceive a refund of prepaid fees for the period after termination.\n13.3 Client Warranty. Client warrants that it has the authority to enter into this\nAgreement and the rights needed to provide Client Data to Provider.\n13.4 Disclaimer. Except as expressly stated in this Agreement, the Services are provided\n\"as is.\" Provider disclaims all implied warranties, including merchantability, fitness for a\nparticular purpose and non-infringement, and does not warrant uninterrupted or error-\nfree operation.\n14. Indemnification\n14.1 By Provider. Provider will defend Client against any third-party claim alleging that the\nServices infringe a United States patent, copyright or trademark or misappropriate a trade\nsecret, and will pay damages finally awarded or agreed in settlement. Provider has no\nobligation to the extent a claim arises from Client Data, modifications not made by\nProvider, combinations with items Provider did not supply, or use in breach of this\nAgreement. Provider may procure the right to continue use, modify the Services, or\nterminate the affected Services and refund prepaid fees.\n14.2 By Client. Client will defend Provider against any third-party claim arising from Client\nData, Client's use of the Services in violation of law, patient messaging sent without\nrequired consent, or clinical care provided by Client, and will pay damages finally awarded\nor agreed in settlement.\n14.3 Procedure. The indemnified party will give prompt written notice, allow the\nindemnifying party sole control of the defense and settlement, and cooperate at the\nindemnifying party's expense.\n\n[[Page 6]]\n14.4 This Section 14 states each party's entire obligation and the other party's exclusive\nremedy for the claims it covers.\n15. Insurance\nDuring the term, Provider will maintain commercial general liability insurance of at least\n$2,000,000 per occurrence and $4,000,000 in the aggregate, technology errors and\nomissions and cyber liability insurance of at least $3,000,000 per claim, and workers'\ncompensation insurance as required by law. Provider will provide certificates of insurance\non request.\n16. Invoice Disputes and Suspension\n16.1 Disputes. If Client disputes an invoice in good faith, Client will notify Provider in\nwriting within 30 days after the invoice date, explain the basis and pay the undisputed\nportion on time.\n16.2 Suspension. If an undisputed amount is more than 30 days overdue, Provider may\nsuspend the Services after 10 days' further written notice. Provider will restore the\nServices within one Business Day after receiving payment and will allow Client to export\nits Client Data during any suspension.\n17. Regulatory Compliance\n17.1 HIPAA. Each party will comply with HIPAA and the HITECH Act as they apply to it.\nProvider is a business associate of Client.\n17.2 Exclusion. Provider represents that neither it nor any person performing the Services\nis excluded from participation in a federal health care program, and will notify Client\nwithin 5 business days if that changes. Client may terminate immediately if Provider is\nexcluded.\n17.3 No Referrals. Nothing in this Agreement requires or is conditioned on the referral of\npatients or business. The fees are consistent with fair market value for the Services, and\nneither party offers or receives remuneration to induce referrals.\n17.4 Accessibility. Provider will use reasonable efforts to keep patient-facing interfaces\nconsistent with WCAG 2.1 Level AA.\n\n[[Page 7]]\n18. Force Majeure\nNeither party is liable for a failure or delay caused by events beyond its reasonable\ncontrol, such as natural disasters, war, terrorism, government action, pandemics,\nwidespread utility or internet failures not caused by that party, and labor disputes other\nthan its own. This Section does not excuse payment obligations. If the event continues for\nmore than 30 days, the other party may terminate the affected Services without liability.\n19. Assignment and Subcontractors\n19.1 Neither party may assign this Agreement without the other's prior written consent,\nwhich will not be unreasonably withheld, except to a successor in a merger, acquisition or\nsale of substantially all of its related assets, on written notice, if the successor assumes\nall obligations in writing.\n19.2 Provider may use subcontractors but remains responsible for their performance. Any\nsubcontractor with access to PHI must be bound by a business associate agreement.\n20. Dispute Resolution\n20.1 Escalation. A party with a dispute will give written notice. Senior representatives of\nboth parties will meet within 15 days and try to resolve the dispute within 30 days after\nthe notice.\n20.2 Courts. If the dispute is not resolved, the state and federal courts located in\nDelaware have exclusive jurisdiction, and each party consents to that jurisdiction. To the\nextent the law allows, each party waives trial by jury.\n20.3 Equitable Relief; Continued Performance. Either party may seek injunctive relief at\nany time to protect its confidential information or intellectual property. Unless this\nAgreement has been terminated, both parties will continue to perform during a dispute.\n21. General Provisions\n21.1 Governing Law. This Agreement is governed by the laws of the State of Delaware,\nwithout regard to its conflict-of-laws rules.\n21.2 Entire Agreement; Order of Precedence. This Agreement, including its Exhibits and\nthe Business Associate Agreement, is the entire agreement of the parties on its subject\nmatter and replaces all earlier proposals and agreements. If documents conflict, the order\nof precedence is: the Business Associate Agreement (for PHI), the body of this\nAgreement, and then the Exhibits.\n\n[[Page 8]]\n21.3 Amendment and Waiver. An amendment must be in writing and signed by both\nparties. A waiver is effective only if in writing, and a waiver of one breach does not waive\nany other.\n21.4 Notices. Notices must be in writing and delivered by hand, by nationally recognized\ncourier, or by email with confirmation of receipt, to the contacts in Exhibit E. Notices of\nbreach, non-renewal or termination must be sent by courier, with a copy by email. A notice\nis effective on receipt.\n21.5 Independent Contractors; No Third-Party Beneficiaries. The parties are\nindependent contractors. This Agreement confers no rights on any third party.\n21.6 Publicity. Neither party will use the other's name or logo in marketing without prior\nwritten consent.\n21.7 Severability. If a provision is held unenforceable, it will be enforced to the extent\npermitted and the rest of this Agreement remains in effect.\n21.8 Survival. Provisions that by their nature should survive termination will survive,\nincluding accrued payment obligations and Sections 6.4, 7, 8, 9, 10, 14, 20 and 21.\n21.9 Counterparts; Electronic Signatures. This Agreement may be signed in counterparts\nand by electronic signature, each of which is an original.\nSignatures\nMediLink Systems, Inc. By: Dana Whitfield, Chief Executive Officer Date: March 1, 2026\nBrightsight Eye Clinic, P.A. By: Dr. Priya Raman, Managing Partner Date: March 1, 2026\nExhibit A: Definitions\nBusiness Associate Agreement: the agreement between the parties governing\nProvider's use and disclosure of PHI.\nBusiness Day: a day other than a Saturday, Sunday or U.S. federal holiday.\nClient Data: all data, including PHI, diagnostic images and imaging metadata, that\nClient or its users enter into or generate through the Services.\nDocumentation: Provider's user guides and technical documentation for the Services,\nas updated from time to time.\nGo-Live: the first day Client uses the Services in production to schedule patients.\nImaging Go-Live: the first day the Imaging Add-on exchanges data with Client's\nimaging systems in production.\n\n[[Page 9]]\nProvider (user count): a physician, optometrist or other clinician for whom Client has\nan active account in the Services.\nSecurity Incident: unauthorized access to, or acquisition, use or disclosure of, Client\nData in Provider's possession or control.\nExhibit B: Services Description and Support\nB.1 Included Services\nPatient registration and demographics\nAppointment scheduling for exam rooms and procedures\nAutomated appointment reminders by text, email and voice\nPatient intake forms and reminders for recall exams\nStandard reports and dashboards\nImaging Add-on: connection to Client's retinal imaging and diagnostic equipment\nthrough DICOM or the equipment vendor's interface, for up to three devices\nOnboarding training: up to 8 hours, delivered virtually\nB.2 Support\nProvider provides support Monday to Friday, 8:00 a.m. to 6:00 p.m. Eastern Time, excluding\nU.S. federal holidays, by phone, email and web portal. Severity 1 issues may also be\nreported to an on-call line outside those hours.\nThese times are targets and do not create service credits. Service credits are governed\nsolely by Section 5.\nSeverity Definition Response Target resolution or\nworkaround\n1 Services unavailable or unable to\nschedule patients\n1 hour, any\ntime\n8 hours\n2 Major function degraded,\nworkaround exists\n4 business\nhours\n2 Business Days\n3 Minor function affected 1 Business\nDay\n7 Business Days\n4 Question or enhancement request 2 Business\nDays\nNext scheduled release\n\n[[Page 10]]\nB.3 Maintenance\nProvider performs scheduled maintenance on Saturdays between 10:00 p.m. and 2:00 a.m.\nEastern Time, with at least 3 days' notice. Scheduled maintenance is excluded from the\navailability calculation in Section 5.\nExhibit C: Fee Schedule\nC.1 Recurring Fees\nC.2 One-Time and Other Charges\nC.3 Invoicing\nInvoices are issued on the first day of each month and are payable within 30 days.\nMessaging overage and any other arrears charges are invoiced within 10 days after month\nend. Invoices are sent by email to the billing contact in Exhibit E.\nItem Amount Starts Billing\nSubscription Fee, 6\nproviders\n$495 per provider per\nmonth ($2,970 per\nmonth)\nMarch 1, 2026 Monthly in\nadvance\nImaging Add-on $1,200 per month Earlier of Imaging Go-Live\nor September 1, 2026\nMonthly in\nadvance\nSMS overage $0.04 per message\nabove 3,000 per month\nMarch 1, 2026 Monthly in\narrears\nItem Amount Billing\nOnboarding Fee $9,500 Upon signing\nAdditional training $900 per half-day session Monthly in arrears\nEarly termination fee\n(Section 6.2)\nThree months of\nSubscription Fees\nUpon termination\nRenewal loyalty credit\n(Section 3.6)\nOne month of Subscription\nFees\nCredit on first renewal-term\ninvoice\n\n[[Page 11]]\nExhibit D: Onboarding Plan\nProvider's target dates depend on Client providing timely access to staff and data. Fee\nstart dates are set by Section 3 and Exhibit C.\nExhibit E: Notice Details and Contacts\nStep Activities Target\n1. Kickoff Confirm providers, rooms, appointment\ntypes and reminder rules\nWeek 1\n2. Configuration Set up schedules, templates and user\naccounts; import patient list\nWeeks 2 to 3\n3. Training Staff training sessions and test\nscheduling\nWeek 4\n4. Go-Live Production launch of scheduling and\nreminders\nApril 15, 2026 (target)\n5. Imaging\nintegration\nConnect up to three imaging devices and\ntest image exchange\nBy September 1, 2026\n(target)\nRole Provider Client\nLegal\nnotices\nGeneral Counsel, MediLink\nSystems, Inc., 500 Innovation Way,\nSuite 300, Wilmington, Delaware\n19801; legal@medilink.example\nManaging Partner, Brightsight Eye\nClinic, P.A., 88 Optic Lane, Suite 2;\npartners@brightsighteye.example\nBilling billing@medilink.example office@brightsighteye.example\nTechnical\nand security\nsecurity@medilink.example admin@brightsighteye.example","documents":[{"id":"d1","name":"Contract_2_-_Brightsight_Eye_Clinic.pdf","kind":"original","addedAt":"2026-10-06T09:00:00.000Z"}]},{"area":"customers","org":"Maple Street Family Medicine, LLC","counterparty":"MediLink Systems, Inc.","contractType":"Subscription Agreement with Adoption Incentive (amended)","industry":"Healthcare - Primary care","startDate":"2026-06-01","endDate":"2028-05-31","autoRenew":true,"renewalNoticeDays":90,"annualValue":28650,"totalValue":54297,"maxBonus":12000,"reviewState":"conflict","riskLevel":"Low","summary":"24-month patient portal s
