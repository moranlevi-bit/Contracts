        y += 10; doc.setFontSize(12); doc.text(s.title, 40, y); y += 6;
        doc.autoTable({ startY: y, head: [s.columns], body: s.rows.map((r) => r.map((v, i) => (s.money?.[i] && typeof v === "number" ? money(v) : v ?? ""))), styles: { fontSize: 7.5, cellPadding: 3, overflow: "linebreak" }, headStyles: { fillColor: [1, 118, 211] }, margin: { left: 40, right: 40 } });
        y = doc.lastAutoTable.finalY + 14; if (y > 520) { doc.addPage(); y = 40; }
      }
      const pages = doc.getNumberOfPages(); for (let i = 1; i <= pages; i++) { doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120); doc.text(`Promisely · generated ${new Date().toLocaleDateString()} · page ${i} of ${pages}`, 40, doc.internal.pageSize.getHeight() - 20); }
      return saveFile(fileBase(title) + ".pdf", doc.output("arraybuffer"), "application/pdf");
    }
  }
  function obExportSections(list) {
    return [{ title: "Obligations", columns: ["Kind", "Counterparty", "Tab", "Obligation", "Type", "Due", "Recurrence", "Amount", "Fixed / conditional", "Condition", "Status", "Owner", "Late terms", "Note", "Source page", "Source passage"],
      rows: list.map((o) => [o.side === "mine" ? "Commitment" : "Entitlement", o.c.org, AREAS[o.c.area].label, o.text, o.category, o.due || "", o.recurrence || "", num(o.amount), num(o.amount) === null ? "" : o.conditional ? "Conditional" : "Fixed", o.condition || "", OB_ST[o.state], o.owner || "", o.lateTerms || "", o.note || "", o.page || "", o.src || ""]), money: [false, false, false, false, false, false, false, true] }];
  }
  function areaExportSections(area) {
    const list = V().filter((c) => c.area === area);
    return [{ title: AREAS[area].label + " contracts", columns: ["Counterparty", "Status", "Review state", ...FIELDS[area].map((f) => f.l)], rows: list.map((c) => [c.org, status(c), RV_LABEL[reviewState(c)], ...FIELDS[area].map((f) => fvx(c, f.k))]) }];
  }

  // ---------- examples ----------
  const DEMO_USERS = [{ id: "u_avery", name: "Avery Stone (example)", email: "avery@example.com", role: "finance", group: "Finance" }, { id: "u_jordan", name: "Jordan Lee (example)", email: "jordan@example.com", role: "hr", group: "People" }, { id: "u_sam", name: "Sam Rivera (example)", email: "sam@example.com", role: "cm", group: "Operations" }, { id: "u_riley", name: "Riley Chen (example)", email: "riley@example.com", role: "viewer", group: "" }];
  async function toggleExamples() {
    const ex = contracts.filter((c) => c.example);
    try {
      if (ex.length) { for (const c of ex) await removeContract(c.id); L.users = L.users.filter((u) => !DEMO_USERS.some((d) => d.id === u.id)); await saveLedger(); logEvent("Removed example contracts"); toast("Examples removed"); }
      else {
        const data = JSON.parse($("exdata").textContent);
        if (!L.myCompany) L.myCompany = "MediLink Systems, Inc.";
        for (const d of DEMO_USERS) if (!L.users.some((u) => u.id === d.id)) L.users.push(d);
        await saveLedger();
        for (const e of data) {
          const rec = { ...e, example: true, grants: e.area === "customers" && e.org.startsWith("Lakeshore") ? [{ who: "u_riley", level: "View" }] : [], restricted: false, addedAt: new Date().toISOString(), keyDates: [], insights: null,
            activity: [{ at: new Date().toISOString(), text: "Example record loaded", by: actor() }] };
          await addContract(rec);
        }
        logEvent("Loaded example contracts", "", data.length + " contracts"); toast("Example contracts added"); closeModal();
      }
    } catch (e) { toast("Couldn't update examples: " + (e?.message || e?.code || "try again")); }
  }

  // ---------- modal ----------
  function openModal(mode = { kind: "new" }, area) {
    upMode = mode; $("queue").innerHTML = "";
    $("upFields").hidden = mode.kind !== "new"; $("attFields").hidden = mode.kind !== "attach";
    $("mTitle").textContent = mode.kind === "attach" ? "Attach a document" : "Upload contracts";
    $("sampleBtn").hidden = mode.kind !== "new" || viewer().role !== "admin";
    $("sampleBtn").textContent = contracts.some((c) => c.example) ? "Remove examples" : "Load examples";
    if (mode.kind === "attach") $("attTo").value = byId(mode.id)?.org || "";
    $("myOrg").value = L.myCompany; if (area) $("upArea").value = area;
    closeDrawer(); $("modal").hidden = false; $("scrim").hidden = false; $("chooseBtn").focus();
  }
  function closeModal() { $("modal").hidden = true; $("scrim").hidden = true; }

  // ---------- events ----------
  document.addEventListener("click", async (e) => {
    if (!e.target.closest("[data-menu]")) closeMenu();
    const t = e.target.closest("[data-menu],[data-obf],[data-obd],[data-obmark],[data-obdispute],[data-obnotesave],[data-obdel],[data-src],[data-hl],[data-review],[data-fact],[data-report],[data-go],[data-open],[data-act],[data-rtab],[data-ask],[data-obview],[data-obside],[data-obwhen],[data-carea],[data-calm],[data-forecast],[data-preview],[data-udel],[data-ungrant],[data-ungrantc],[data-runsaved],[data-delsaved],[data-fb],[data-move],[data-atab]");
    if (!t) return;
    if (t.tagName === "A") e.preventDefault();
    const d = t.dataset;
    if (d.menu) { if (menuEl && menuEl.dataset.kind === d.menu) return closeMenu(); return openMenu(d.menu, t); }
    closeMenu();
    if (d.obf) { const [side, when] = d.obf.split(":"); obF = { ...obF, side, when: when || "open", area: "", cp: "", cat: "", q: "", view: "list" }; return go("obligations"); }
    if (d.obd) return openDrawer(d.obd);
    if (d.obmark) return markOb(d.obmark, d.on === "1");
    if (d.obdispute) { const { o } = findOb(d.obdispute); return o && patchOb(d.obdispute, (x) => { x.status = x.status === "disputed" ? "open" : "disputed"; return x; }, `${o.text}: ${o.status === "disputed" ? "dispute cleared" : "marked disputed"}`); }
    if (d.obnotesave) { const v = document.querySelector(`[data-obnote="${CSS.escape(d.obnotesave)}"]`)?.value || ""; const { o } = findOb(d.obnotesave); if (o) { await patchOb(d.obnotesave, (x) => { x.note = v.slice(0, 1000); return x; }, `${o.text}: note updated`); toast("Note saved"); } return; }
    if (d.obdel) { const c = byId(route.id); if (!c) return; const o = (c.obligations || []).find((x) => x.id === d.obdel); closeDrawer(); await saveContract(c.id, { ...stripId(c), obligations: (c.obligations || []).filter((x) => x.id !== d.obdel), activity: withAct(c, "Removed obligation: " + (o?.text || "")) }); return logEvent("Obligation removed", c.org, o?.text || ""); }
    if (d.src) { const i = d.src.indexOf("|"); const cid = d.src.slice(0, i), q = d.src.slice(i + 1); if (!byId(cid)) return; closeDrawer(); closeModal(); route = { name: "review", id: cid }; reviewHL = q || null; render(); scrollTo(0, 0); updateAsstContext(); return; }
    if (d.hl) { reviewHL = d.hl; $("doctext").innerHTML = docHtml(byId(route.id)); const m = document.getElementById("hl"); if (m) m.scrollIntoView({ block: "center", behavior: "smooth" }); else toast("That passage isn't in the text word for word."); return; }
    if (d.review) { closeModal(); return go("review", d.review); }
    if (d.fact) { const c = byId(route.id); if (c && canEdit(c)) await fieldAction(c, d.k, d.fact); return; }
    if (d.report) { rf = defaultRF(); return go("report", d.report); }
    if (d.forecast) { const [f, to] = d.forecast.split("|"); rf = { ...defaultRF(), from: f, to }; return go("report", "forecast"); }
    if (d.go) { if (d.go === "contracts") cF.area = cF.area || ""; return go(d.go); }
    if (d.open) { closeModal(); closeDrawer(); return go("record", d.open); }
    if (d.rtab) { recTab = d.rtab; showAdd = false; return render(); }
    if (d.atab) { adminTab = d.atab; return render(); }
    if (d.ask) { const c = route.name === "record" ? byId(route.id) : null; if (c && scope.kind !== "contract") await setScope({ kind: "contract", id: c.id }); openAsst(true); return send(d.ask); }
    if (d.obview) { obF.view = d.obview; return render(); }
    if (d.obside) { obF.side = d.obside; return render(); }
    if (d.obwhen) { obF.when = d.obwhen; return render(); }
    if (d.carea !== undefined) { cF.area = d.carea; return render(); }
    if (d.calm) { obF.month = d.calm; return render(); }
    if (d.move) { const c = byId(route.id); if (c && canEdit(c)) { const from = c.area; await saveContract(c.id, mirror({ ...stripId(c), area: d.move, activity: withAct(c, `Moved from ${AREAS[from].label} to ${AREAS[d.move].label}`) })); logEvent("Moved contract", c.org, `${AREAS[from].label} → ${AREAS[d.move].label}`); toast("Moved to " + AREAS[d.move].label); } return; }
    if (d.preview !== undefined) { previewId = d.preview; logEvent(previewId ? "Started viewing as" : "Stopped viewing as", previewId ? viewer().name : ""); await setScope({ kind: "all" }); return go(["record", "review", "admin"].includes(route.name) ? "home" : route.name); }
    if (d.udel) { const u = L.users.find((x) => x.id === d.udel); L.users = L.users.filter((x) => x.id !== d.udel); if (previewId === d.udel) previewId = ""; await saveLedger(); logEvent("Removed user", u?.name || ""); return render(); }
    if (d.ungrant) { const c = byId(route.id); if (!c || !canManage(c)) return; await saveContract(c.id, { ...stripId(c), grants: (c.grants || []).filter((g) => g.who !== d.ungrant), activity: withAct(c, "Access removed: " + d.ungrant) }); return logEvent("Sharing changed: access removed", c.org, d.ungrant); }
    if (d.ungrantc) { const [cid, who] = d.ungrantc.split("|"); const c = contracts.find((x) => x.id === cid); if (!c) return; await saveContract(c.id, { ...stripId(c), grants: (c.grants || []).filter((g) => g.who !== who), activity: withAct(c, "Access removed: " + who) }); return logEvent("Sharing changed: access removed", c.org, who); }
    if (d.runsaved) { const s = L.savedReports[Number(d.runsaved)]; if (s) { rf = { ...defaultRF(), ...s.filters }; return go("report", s.key); } return; }
    if (d.delsaved) { L.savedReports.splice(Number(d.delsaved), 1); await saveLedger(); return render(); }
    if (d.fb) { const [i, v] = d.fb.split("|"); return feedback(Number(i), v); }
    const c = route.name === "record" || route.name === "review" ? byId(route.id) : null;
    switch (d.act) {
      case "add": return openModal({ kind: "new" }, d.area && d.area !== "auto" ? d.area : "auto");
      case "examples": return toggleExamples();
      case "attach": return c && openModal({ kind: "attach", id: c.id });
      case "closeDrawer": return closeDrawer();
      case "endPreview": previewId = ""; return go("home");
      case "showAdd": case "showAddOb": recTab = "obligations"; showAdd = true; render(); $("nobText")?.focus(); return;
      case "addOb": if (c) { await addOb(c); showAdd = false; render(); } return;
      case "findObs": return c && findObs(c);
      case "analyze": return c && analyze(c);
      case "askContract": if (c) { await setScope({ kind: "contract", id: c.id }); openAsst(true); } return;
      case "areaAsk": await setScope(cF.area ? { kind: "area", area: cF.area } : { kind: "all" }); return openAsst(true);
      case "confirmHigh": return c && confirmHigh(c);
      case "obMore": obF.more = !obF.more; return render();
      case "del": if (!c) return; { const box = document.createElement("div"); box.className = "notice"; box.style.background = "var(--red-soft)"; box.style.color = "var(--red)"; box.innerHTML = `<span>Delete ${esc(c.org)} and its documents? This can't be undone.</span><span style="display:flex;gap:8px"><button class="btn sm" data-act="delYes">Delete</button><button class="btn sm" data-act="delNo">Cancel</button></span>`; document.querySelector(".rec-head")?.after(box); } return;
      case "delNo": return render();
      case "delYes": { const id = c.id, org = c.org; go("contracts"); await removeContract(id); logEvent("Deleted contract", org); return toast("Deleted"); }
      case "grant": { if (!c || !canManage(c)) return; const who = $("grantWho").value, level = $("grantLvl").value; const grants = (c.grants || []).filter((g) => g.who !== who).concat({ who, level }); await saveContract(c.id, { ...stripId(c), grants, activity: withAct(c, `Shared with ${who} (${level})`) }); logEvent("Sharing changed: access granted", c.org, `${L.users.find((u) => u.id === who)?.name || who} — ${level}`); return toast("Shared"); }
      case "exportObXlsx": case "exportObCsv": { const l = obFiltered(); return exportSections(SIDE[obF.side].label, { filters: { kind: SIDE[obF.side].label, when: obF.when, area: obF.area, cp: obF.cp, cat: obF.cat, q: obF.q }, unverified: l.some((o) => reviewState(o.c) !== "verified") }, obExportSections(l), d.act === "exportObXlsx" ? "xlsx" : "csv"); }
      case "exportCXlsx": case "exportCCsv": { const areas = cF.area ? [cF.area] : AREA_KEYS.filter((a) => canSeeArea(a)); return exportSections(cF.area ? AREAS[cF.area].label + " contracts" : "Contracts", { filters: { area: cF.area, q: cF.q }, unverified: true }, areas.flatMap(areaExportSections).filter((s) => s.rows.length), d.act === "exportCXlsx" ? "xlsx" : "csv"); }
      case "rPdf": return lastReport && exportSections(lastReport.title, lastReport, lastReport.sections, "pdf");
      case "rXlsx": return lastReport && exportSections(lastReport.title, lastReport, lastReport.sections, "xlsx");
      case "rCsv": return lastReport && exportSections(lastReport.title, lastReport, lastReport.sections, "csv");
      case "rSave": { if (!lastReport) return; const name = `${lastReport.title} · ${fmtD(rf.from)} – ${fmtD(rf.to)}${rf.cp ? " · " + rf.cp : ""}`; L.savedReports = [...(L.savedReports || []), { name, key: lastReport.key, filters: { ...rf }, savedAt: new Date().toISOString() }].slice(-30); await saveLedger(); logEvent("Saved report", name); return toast("Saved. Find it under Reports."); }
      case "rAsk": { if (!lastReport) return; await setScope({ kind: "all" }); openAsst(true); return send(`Explain the "${lastReport.title}" for ${rf.from} to ${rf.to}${rf.cp ? " for " + rf.cp : ""}: what stands out and what should we act on?`); }
      case "saveOrg": { L.myCompany = $("ad_org").value.trim(); const parse = (s) => s.split(/[,\s]+/).map(Number).filter((n) => n > 0 && n < 400).sort((a, b) => b - a); L.settings = { noticeDays: parse($("ad_nd").value).length ? parse($("ad_nd").value) : [90, 60, 30], payDays: parse($("ad_pd").value).length ? parse($("ad_pd").value) : [7, 1] }; await saveLedger(); logEvent("Settings changed", "Organization", L.myCompany); render(); return toast("Saved"); }
      case "addUser": { const name = $("nu_name").value.trim(); if (!name) { $("nu_name").focus(); return; } const u = { id: uid("u"), name, email: $("nu_email").value.trim(), role: $("nu_role").value, group: $("nu_group").value.trim() }; L.users = [...L.users, u]; await saveLedger(); logEvent("Added user", name, ROLES[u.role]); return render(); }
    }
  });
  document.addEventListener("change", async (e) => {
    const t = e.target, id = t.id;
    if (t.dataset?.obowner) { const v = t.value; const { o } = findOb(t.dataset.obowner); return o && patchOb(t.dataset.obowner, (x) => { x.owner = v; return x; }, `${o.text}: owner set to ${v || "unassigned"}`); }
    if (t.dataset?.urole) { const u = L.users.find((x) => x.id === t.dataset.urole); if (u) { const old = u.role; u.role = t.value; await saveLedger(); logEvent("Role changed", u.name, `${ROLES[old]} → ${ROLES[u.role]}`); render(); } return; }
    if (t.dataset?.ugroup) { const u = L.users.find((x) => x.id === t.dataset.ugroup); if (u) { u.group = t.value.trim(); await saveLedger(); logEvent("Group changed", u.name, u.group); } return; }
    if (id === "restrictChk") { const c = byId(route.id); if (c && canManage(c)) { await saveContract(c.id, { ...stripId(c), restricted: t.checked, activity: withAct(c, t.checked ? "Restricted to named people" : "Restriction removed") }); logEvent("Sharing changed: " + (t.checked ? "restricted" : "unrestricted"), c.org); } return; }
    const ofMap = { of_area: "area", of_cp: "cp", of_cat: "cat" };
    if (ofMap[id]) { obF[ofMap[id]] = t.value; return render(); }
    const rfMap = { rf_area: "area", rf_cp: "cp", rf_from: "from", rf_to: "to", rf_party: "party" };
    if (rfMap[id]) { rf[rfMap[id]] = t.value; return render(); }
    if (id === "rf_ver") { rf.verifiedOnly = t.checked; return render(); }
  });
  document.addEventListener("input", (e) => {
    const id = e.target.id;
    const keep = (k, obj) => { obj[k] = e.target.value; const pos = e.target.selectionStart; render(); const el = $(id); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch {} } };
    if (id === "of_q") keep("q", obF); else if (id === "cf_q") keep("q", cF);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { if (menuEl) closeMenu(); else if (drawerKey) closeDrawer(); else if (!$("modal").hidden) closeModal(); else if (!$("asst").hidden) openAsst(false); }
    if (e.key === "Enter" && e.target.id === "nobText") document.querySelector('[data-act="addOb"]')?.click();
    if (e.key === "Enter" && e.target.matches("[data-open],[data-review],[data-report],[data-obd],[data-src]") && !["BUTTON", "A"].includes(e.target.tagName)) e.target.click();
  });
  $("gq").addEventListener("keydown", (e) => { if (e.key === "Enter") { const q = e.target.value.trim(); if (q) { logEvent("Searched", "", q); go("search", q); } } });
  $("addBtn").addEventListener("click", () => openModal({ kind: "new" }, route.name === "contracts" && cF.area ? cF.area : "auto"));
  $("closeModal").addEventListener("click", closeModal);
  $("scrim").addEventListener("click", () => { closeModal(); closeDrawer(); });
  $("chooseBtn").addEventListener("click", () => $("fileInput").click());
  $("sampleBtn").addEventListener("click", toggleExamples);
  $("fileInput").addEventListener("change", (e) => { if (upMode.kind === "attach") upMode.docKind = $("attKind").value; processFiles([...e.target.files]); e.target.value = ""; });
  const drop = $("drop");
  ["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("drag"); }));
  ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("drag"); }));
  drop.addEventListener("drop", (e) => { if (upMode.kind === "attach") upMode.docKind = $("attKind").value; processFiles([...(e.dataTransfer?.files || [])]); });
  $("asstBtn").addEventListener("click", async () => { const open = $("asst").hidden; if (open) { const c = route.name === "record" ? byId(route.id) : null; const want = c ? { kind: "contract", id: c.id } : route.name === "contracts" && cF.area ? { kind: "area", area: cF.area } : { kind: "all" }; const wk = want.kind === "contract" ? "c_" + want.id : want.kind === "area" ? "a_" + want.area : "all"; if (scopeKey() !== wk) await setScope(want); } openAsst(open); });
  $("closeAsst").addEventListener("click", () => openAsst(false));
  $("newChat").addEventListener("click", () => { asstCtl?.abort(); turns = []; renderThread(); updateAsstContext(); saveChat(); });
  $("sendBtn").addEventListener("click", () => send($("prompt").value));
  $("stopBtn").addEventListener("click", () => asstCtl?.abort());
  $("prompt").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("prompt").value); } });
  addEventListener("resize", closeMenu);
  document.addEventListener("mousemove", (e) => {
    const r = e.target.closest?.(".bar-row"); const tip = $("tip");
    if (!r) { tip.hidden = true; return; }
    const [k, v] = r.dataset.tip.split("|"); tip.innerHTML = `<b>${esc(k)}</b>${esc(v)}`; tip.hidden = false;
    tip.style.left = Math.min(e.clientX + 14, innerWidth - 250) + "px"; tip.style.top = e.clientY + 14 + "px";
  });

  // ---------- boot ----------
  if (window.pdfjsLib) { try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; } catch {} }
  render(); renderThread(); updateAsstContext();
  (async () => {
    const use = window.claude?.use;
    if (!use) { state.banner = "Open this page on claude.ai to save contracts and use the AI. Changes here aren't saved."; render(); return; }
    const [db, user, smp, dl] = await Promise.all(["db", "user", "sample", "downloads"].map((n) => use(n).catch(() => null)));
    sample = smp; downloads = dl;
    if (sample) { const lim = await sample.limits().catch(() => null); if (lim) { maxPrompt = lim.maxPromptBytes || maxPrompt; toolsOK = !!lim.tools; imagesLim = lim.images || null; } }
    else state.banner = "AI features aren't available in this view. You can still view and edit saved contracts.";
    realId = user ? await user.id().catch(() => null) : null;
    userName = user ? await user.name().catch(() => "") : "";
    $("avatar").textContent = userName ? userName.split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase() : "Me";
    if (db && realId) {
      ledgerDoc = db.doc("data/users/" + realId + "/promisely");
      store = ledgerDoc.collection("contracts"); auditCol = ledgerDoc.collection("audit"); chatCol = ledgerDoc.collection("chats"); fbCol = ledgerDoc.collection("feedback");
      ledgerDoc.onSnapshot((snap) => { const d = (snap.exists && snap.data()) || {}; L = { myCompany: d.myCompany || "", users: Array.isArray(d.users) ? d.users : [], savedReports: Array.isArray(d.savedReports) ? d.savedReports : [], settings: d.settings || { noticeDays: [90, 60, 30], payDays: [7, 1] } }; safeRender(); }, () => {});
      auditCol.orderBy("at", "desc").limit(300).onSnapshot((snap) => { auditLog = snap.docs.map((x) => x.data()); if (route.name === "admin" || String(route.id || "").startsWith("access")) safeRender(); }, () => {});
      store.onSnapshot((snap) => { contracts = snap.docs.map((x) => ({ id: x.id, ...x.data() })); safeRender(); updateAsstContext(); },
        (e) => { state.banner = "Your contracts couldn't be loaded (" + (e?.code || "error") + "). Reload the page to try again."; render(); });
      setScope({ kind: "all" });
    } else if (!state.banner) state.banner = "Sign in to claude.ai to save your contracts. Until then, anything you add disappears when you close the page.";
    render(); updateAsstContext();
  })();
  function safeRender() {
    const a = document.activeElement;
    if (a && ["of_q", "cf_q", "prompt", "nobText", "nobAmt", "gq", "nu_name", "nu_email", "nu_group", "ad_org", "ad_nd", "ad_pd"].includes(a.id)) { renderChrome(); return; }
    if (a && (a.matches?.("[data-fin]") || a.matches?.("[data-obnote]") || a.matches?.("[data-ugroup]"))) { renderChrome(); return; }
    render();
  }
})();

</script>
